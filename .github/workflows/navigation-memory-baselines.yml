name: Navigation memory baselines
on:
  push:
    branches: [experiment/navigation-memory-baselines]
    paths:
      - '.github/workflows/navigation-memory-baselines.yml'
      - 'scripts/prepare_diskannpp_qsev.py'
      - 'scripts/patch_diskann_qsev.py'
      - 'scripts/qualify_navigation_memory_baselines.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-navigation-memory-baselines
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare environment and frozen inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          mkdir -p artifacts/navigation-memory-baselines
          base="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/catapult-paper-pubmed1m/throughput-only.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          qsev_dir="$HOME/.cache/geoivf/pubmed1m-qsev-3mib-v1"

          test -s "$base"
          test -s "$queries"
          test -s "$gt"
          mkdir -p "$qsev_dir"

          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "QSEV_DIR=$qsev_dir" >> "$GITHUB_ENV"

          git rev-parse HEAD > artifacts/navigation-memory-baselines/geoivf-commit.txt
          { uname -a; lscpu; free -h; df -h; lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS; } \
            > artifacts/navigation-memory-baselines/host.txt
          .venv/bin/python -m py_compile \
            scripts/prepare_diskannpp_qsev.py \
            scripts/patch_diskann_qsev.py \
            scripts/qualify_navigation_memory_baselines.py

      - name: Build memory-matched DiskANN++ QSEV pool
        run: |
          set -euxo pipefail
          qsev="$QSEV_DIR/qsev-1024.bin"
          manifest="$QSEV_DIR/qsev-1024.manifest.json"
          if [ ! -s "$qsev" ] || [ ! -s "$manifest" ]; then
            rm -f "$qsev" "$manifest"
            .venv/bin/python scripts/prepare_diskannpp_qsev.py \
              --base "$BASE" \
              --index-prefix "$INDEX_PREFIX" \
              --out "$qsev" \
              --clusters 1023 \
              --train-size 100000 \
              --seed 12345 \
              --threads 4 \
              2>&1 | tee artifacts/navigation-memory-baselines/qsev-build.log
          fi
          test -s "$qsev"
          test -s "$manifest"
          cp "$manifest" artifacts/navigation-memory-baselines/qsev.manifest.json
          sha256sum "$qsev" > artifacts/navigation-memory-baselines/qsev.sha256
          echo "QSEV=$qsev" >> "$GITHUB_ENV"

      - name: Patch and compile pinned DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-memory-baselines
          git -C third_party/DiskANN-memory-baselines checkout --detach "$rev"
          test "$(git -C third_party/DiskANN-memory-baselines rev-parse HEAD)" = "$rev"

          CARGO_HOME="$RUNNER_TEMP/memory-baseline-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/memory-baseline-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_qsev.py third_party/DiskANN-memory-baselines
          (cd third_party/DiskANN-memory-baselines && cargo fmt --all)
          git -C third_party/DiskANN-memory-baselines diff --check
          git -C third_party/DiskANN-memory-baselines diff \
            > artifacts/navigation-memory-baselines/qsev.patch
          (cd third_party/DiskANN-memory-baselines && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/navigation-memory-baselines/build.log

          echo "DISKANN_BIN=$PWD/third_party/DiskANN-memory-baselines/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Run same-budget heldout comparison
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/navigation-memory-baselines-${GITHUB_RUN_ID}"
          out="$PWD/artifacts/navigation-memory-baselines/results"
          mkdir -p "$work" "$out"

          .venv/bin/python scripts/qualify_navigation_memory_baselines.py \
            --binary "$DISKANN_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --qsev "$QSEV" \
            --work "$work" \
            --out "$out" \
            --train-rows 5000 \
            --reps 3 \
            2>&1 | tee artifacts/navigation-memory-baselines/eval.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-memory-baselines-${{ github.run_id }}
          path: artifacts/navigation-memory-baselines/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/memory-baseline-cargo-${GITHUB_RUN_ID}" \
                 "$RUNNER_TEMP/memory-baseline-rustup-${GITHUB_RUN_ID}"
