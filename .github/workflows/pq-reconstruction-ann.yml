name: PQ reconstruction ANN screen

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/pq-reconstruction-ann.yml'
      - 'scripts/evaluate_pq_reconstruction_ann.py'
      - 'scripts/analyze_pq_semantic_filter.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-pq-reconstruction-ann
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare environment
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/pq-reconstruction-ann"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          PIVOTS="$INDEX"_pq_pivots.bin
          CODES="$INDEX"_pq_compressed.bin
          CACHE="$HOME/.cache/geoivf/pq-reconstruction-ann-v1"
          HNSW="$CACHE/pubmed1m-pq-reconstruction-hnsw-M16.index"

          mkdir -p "$ART" "$CACHE"
          for f in "$BASE" "$QUERIES" "$GT5000" "$PIVOTS" "$CODES"; do
            test -s "$f"
          done

          # This is a derived quality-screen index. Reclaim old derived graph
          # copies if the cache volume is tight; never touch the canonical index.
          avail_kb=$(df -Pk "$HOME/.cache/geoivf" | awk 'NR==2{print $4}')
          if [ "$avail_kb" -lt 8000000 ]; then
            rm -f "$HOME/.cache/geoivf/embedded-navhints-v1/diskann-index_disk.index" || true
          fi

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "PIVOTS=$PIVOTS" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"
          echo "HNSW=$HNSW" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          { free -h; df -h; } > "$ART/host-before.txt"
          .venv/bin/python -m py_compile scripts/evaluate_pq_reconstruction_ann.py scripts/analyze_pq_semantic_filter.py

      - name: Build or load PQ-reconstruction HNSW and evaluate
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/evaluate_pq_reconstruction_ann.py \
            --base "$BASE" \
            --queries "$QUERIES" \
            --gt5000 "$GT5000" \
            --pq-pivots "$PIVOTS" \
            --pq-codes "$CODES" \
            --index-cache "$HNSW" \
            --out "$ART/pq-reconstruction-ann.json" \
            --query-offset 9000 \
            --gt-offset 4000 \
            --query-count 1000 \
            --M 16 \
            --ef-construction 80 \
            --add-batch 8192 \
            --threads 4 \
            --candidate-budgets "10,20,50,100,200,500,1000" \
            --ef-search "32,64,128,256,512,1024,2048" \
            2>&1 | tee "$ART/eval.log"
          { free -h; df -h; } > "$ART/host-after.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pq-reconstruction-ann-${{ github.run_id }}
          path: artifacts/pq-reconstruction-ann/
          retention-days: 30
