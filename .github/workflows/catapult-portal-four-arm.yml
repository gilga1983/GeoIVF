name: CatapultDB plus static portal four-arm test
on:
  push:
    branches: [experiment/catapult-official]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-catapult-zipf
  cancel-in-progress: true

jobs:
  four-arm:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Yahoo cold and warm workloads
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install diskannpy==0.7.0 h5py==3.10.0

          python -m venv .portal-venv
          .portal-venv/bin/pip install --upgrade pip
          .portal-venv/bin/pip install -r requirements.txt

          mkdir -p artifacts/catapult-portal
          data="$RUNNER_TEMP/catapult-portal-data-${GITHUB_RUN_ID}"
          index="$RUNNER_TEMP/catapult-portal-index-${GITHUB_RUN_ID}"
          replay="$RUNNER_TEMP/catapult-portal-replay-${GITHUB_RUN_ID}"
          mkdir -p "$data" "$index" "$replay"
          echo "DATA_DIR=$data" >> "$GITHUB_ENV"
          echo "INDEX_DIR=$index" >> "$GITHUB_ENV"
          echo "REPLAY_DIR=$replay" >> "$GITHUB_ENV"

          .venv/bin/python scripts/fetch_ann_dataset.py yahoo-minilm-384-normalized \
            --report artifacts/catapult-portal/dataset-source.json
          .venv/bin/python scripts/prepare_catapult_official_yahoo.py \
            --data "$HOME/.cache/geoivf/datasets/yahoo-minilm-384-normalized.hdf5" \
            --out "$data"
          .venv/bin/python scripts/prepare_catapult_zipf_replay.py \
            --queries "$data/queries.npy" --gt "$data/gt_ids.npy" \
            --out "$replay" --length 30000 --seed 20261003 \
            > artifacts/catapult-portal/replay-generation.log
          cp "$replay/meta-z1p0.json" artifacts/catapult-portal/
          cp "$replay/zipf-replay.json" artifacts/catapult-portal/
          git rev-parse HEAD > artifacts/catapult-portal/geoivf-commit.txt
          { uname -a; lscpu; free -h; df -h; } > artifacts/catapult-portal/host.txt

      - name: Build the previously qualified static portal table
        run: |
          set -euxo pipefail
          router="$RUNNER_TEMP/catapult-portal-router-${GITHUB_RUN_ID}.bin"
          echo "PORTAL_ROUTER=$router" >> "$GITHUB_ENV"
          .portal-venv/bin/python scripts/prepare_catapult_portal_router.py \
            --data "$HOME/.cache/geoivf/datasets/yahoo-minilm-384-normalized.hdf5" \
            --out "$router" \
            2>&1 | tee artifacts/catapult-portal/portal-router-build.log
          cp "${router%.bin}.json" artifacts/catapult-portal/portal-router.json
          sha256sum "$router" > artifacts/catapult-portal/portal-router-sha256.txt
          .portal-venv/bin/pip freeze > artifacts/catapult-portal/portal-python-packages.txt

      - name: Build one shared official DiskANN Vamana graph
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/run_diskannpy_yahoo.py \
            --base "$DATA_DIR/base.fbin" \
            --queries "$DATA_DIR/queries.npy" \
            --gt "$DATA_DIR/gt_ids.npy" \
            --index-dir "$INDEX_DIR" \
            --out artifacts/catapult-portal \
            2>&1 | tee artifacts/catapult-portal/diskannpy-build-and-baseline.log
          sha256sum "$INDEX_DIR/ann" "$INDEX_DIR/ann.data" > artifacts/catapult-portal/shared-graph-sha256.txt

      - name: Clone official CatapultDB and patch only the starter
        run: |
          set -euxo pipefail
          rev=7d473050e0a69079d8fc17158f2967486e54380b
          git clone https://gitlab.epfl.ch/randl/catapult.git third_party/catapult
          git -C third_party/catapult checkout --detach "$rev"
          test "$(git -C third_party/catapult rev-parse HEAD)" = "$rev"
          echo "$rev" > artifacts/catapult-portal/catapult-official-commit.txt

          .venv/bin/python scripts/patch_catapult_portal_starter.py third_party/catapult
          git -C third_party/catapult diff --check
          git -C third_party/catapult diff > artifacts/catapult-portal/catapult-portal-starter.patch

          CARGO_HOME="$RUNNER_TEMP/catapult-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/catapult-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/catapult-rustup-install-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/catapult-rustup-install-${GITHUB_RUN_ID}.sh" \
            -y --profile minimal --no-modify-path --default-toolchain nightly
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify and build shared CatapultDB engine
        run: |
          set -euxo pipefail
          env -u CATAPULT_PORTAL_ROUTER_FILE -u CATAPULT_PORTAL_NPROBE \
            cargo test --release --locked --manifest-path third_party/catapult/Cargo.toml \
            2>&1 | tee artifacts/catapult-portal/catapult-tests.log
          cargo build --release --locked --manifest-path third_party/catapult/Cargo.toml \
            2>&1 | tee artifacts/catapult-portal/catapult-build.log
          cargo build --release --manifest-path catapult_eval/Cargo.toml \
            2>&1 | tee artifacts/catapult-portal/catapult-eval-build.log

      - name: Run cold and warm four-arm comparison at beam 60
        run: |
          set -euxo pipefail
          graph="$INDEX_DIR/ann"
          payload="$INDEX_DIR/ann.data"
          official="$PWD/third_party/catapult/target/release/catapult"
          evalbin="$PWD/catapult_eval/target/release/catapult-official-eval"

          cpu=$(.venv/bin/python - <<'PY'
          import os
          print(sorted(os.sched_getaffinity(0))[0])
          PY
          )
          echo "$cpu" > artifacts/catapult-portal/cpu.txt

          for workload in cold warm; do
            if [ "$workload" = cold ]; then
              queries="$DATA_DIR/queries.npy"
            else
              queries="$REPLAY_DIR/queries-z1p0.npy"
            fi

            for arm in lsh-off portal-off lsh-on portal-on; do
              extra=()
              env_args=()
              case "$arm" in
                portal-*)
                  env_args+=("CATAPULT_PORTAL_ROUTER_FILE=$PORTAL_ROUTER")
                  env_args+=("CATAPULT_PORTAL_NPROBE=32")
                  ;;
              esac
              case "$arm" in
                *-on) extra+=(--catapults) ;;
              esac

              for rep in 0 1 2; do
                env "${env_args[@]}" taskset -c "$cpu" "$official" \
                  --queries "$queries" --graph "$graph" --payload "$payload" \
                  "${extra[@]}" --threads 1 --num-neighbors 10 --beam-width 60 \
                  2>&1 | tee "artifacts/catapult-portal/$workload-$arm-r$rep.log"
              done

              env "${env_args[@]}" taskset -c "$cpu" "$evalbin" \
                "$graph" "$payload" "$queries" \
                "$PWD/artifacts/catapult-portal/$workload-$arm" \
                10 60 "${arm##*-}" \
                2>&1 | tee "artifacts/catapult-portal/$workload-$arm-eval.log"
            done
          done

      - name: Summarize four-arm result
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/summarize_catapult_portal_four_arm.py \
            --dir artifacts/catapult-portal \
            --data-dir "$DATA_DIR" \
            --replay-dir "$REPLAY_DIR" \
            2>&1 | tee artifacts/catapult-portal/summary.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catapult-portal-four-arm-${{ github.run_id }}
          path: artifacts/catapult-portal/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$DATA_DIR" "$INDEX_DIR" "$REPLAY_DIR"
          rm -f "$PORTAL_ROUTER" "${PORTAL_ROUTER%.bin}.json"
          rm -rf "$RUNNER_TEMP/catapult-cargo-${GITHUB_RUN_ID}" "$RUNNER_TEMP/catapult-rustup-${GITHUB_RUN_ID}"
