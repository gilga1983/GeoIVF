name: NavHints paper competitors phase 1
on:
  push:
    branches: [experiment/paper-competitors]
    paths:
      - '.github/workflows/paper-competitors-phase1.yml'
      - 'scripts/run_paper_competitors_phase1_ci.sh'
      - 'scripts/qualify_paper_competitors_phase1.py'
      - 'scripts/learn_hot_cache_ids.py'
      - 'scripts/patch_diskann_hot_cache.py'
      - 'scripts/prepare_diskannpp_qsev.py'
      - 'scripts/patch_diskann_qsev.py'
      - 'scripts/patch_diskann_start_points.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_progressive_navhints.py'
      - 'scripts/learn_global_navigation_landmarks.py'
      - 'scripts/build_hint_ivf.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-paper-competitors-phase1
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run same-epoch current-budget competitor frontier
        run: bash scripts/run_paper_competitors_phase1_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-competitors-phase1-${{ github.run_id }}
          path: artifacts/paper-competitors-phase1/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/papercomp-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/papercomp-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/paper-comp-heldout-$GITHUB_RUN_ID.fbin"
