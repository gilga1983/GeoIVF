name: Shared NavHints schedule sweep
on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/shared-schedule-sweep.yml'
      - 'scripts/run_shared_schedule_sweep_ci.sh'
      - 'scripts/qualify_shared_schedule_sweep.py'
      - 'scripts/patch_diskann_shared_multistage_navhints.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-shared-schedule-sweep
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run schedule sweep
        shell: bash
        run: bash scripts/run_shared_schedule_sweep_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-schedule-sweep-${{ github.run_id }}
          path: artifacts/shared-schedule-sweep/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/sharedsweep-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sharedsweep-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sharedsweep-eval-$GITHUB_RUN_ID"
