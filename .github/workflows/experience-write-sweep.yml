name: Sample2 seeding ablation

on:
  push:
    branches: [experiment/sample2-seeding-ablation]
    paths:
      - '.github/workflows/experience-write-sweep.yml'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_experience_core.py'
      - 'scripts/qualify_experience_write_sweep.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-sample2-seeding-ablation
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/experience-write-sweep"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          IVF16="$HOME/.cache/geoivf/paper-competitors-phase1-v1/navhints/hints-b16000-nlist512-spherical.bin"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"

          mkdir -p "$ART"
          for f in "$QUERIES" "$GT5000" "$IVF16"                    "$INDEX"_disk.index "$INDEX"_pq_pivots.bin "$INDEX"_pq_compressed.bin; do
            test -s "$f"
          done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/patch_diskann_hint_ivf_packed_direct.py             scripts/patch_diskann_experience_core.py             scripts/qualify_experience_write_sweep.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/experience-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/experience-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/experience-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/experience-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build consolidated controller
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-experience
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-experience
          git -C third_party/DiskANN-experience checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_hint_ivf_packed_direct.py third_party/DiskANN-experience
          .venv/bin/python scripts/patch_diskann_experience_core.py third_party/DiskANN-experience
          (cd third_party/DiskANN-experience && cargo fmt --all)
          git -C third_party/DiskANN-experience diff --check
          (cd third_party/DiskANN-experience && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/build.log"
          echo "EVAL_BIN=$PWD/third_party/DiskANN-experience/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Evaluate packed write policies
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/experience-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_experience_write_sweep.py             --binary "$EVAL_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$INDEX"             --ivf-16k "$IVF16"             --work "$WORK"             --out "$OUT"             --reps 3             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample2-seeding-ablation-${{ github.run_id }}
          path: artifacts/experience-write-sweep/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/experience-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/experience-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/experience-eval-$GITHUB_RUN_ID"
