name: MedRAG Zipf four-arm SSD
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/medrag-zipf-four-arm.yml'
      - 'scripts/patch_diskann_paper_catapult.py'
      - 'scripts/qualify_medrag_zipf_four_arm.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-medrag-zipf-four-arm
  cancel-in-progress: true

jobs:
  four-arm:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight cached artifacts
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6
          mkdir -p artifacts/medrag-zipf-four-arm

          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/catapult-paper-pubmed1m/throughput-only.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          router="$HOME/.cache/geoivf/pubmed1m-ip-portal-v1/router.bin"

          test -s "$queries"
          test -s "$gt"
          test -s "$router"
          test -s "${index}_pq_pivots.bin" || ls -l "$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1"
          ls -lh "$queries" "$gt" "$router" > artifacts/medrag-zipf-four-arm/cache-files.txt
          sha256sum "$queries" "$router" > artifacts/medrag-zipf-four-arm/input-sha256.txt
          git rev-parse HEAD > artifacts/medrag-zipf-four-arm/geoivf-commit.txt
          { lscpu; free -h; df -h; } > artifacts/medrag-zipf-four-arm/host.txt

          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "PORTAL_ROUTER=$router" >> "$GITHUB_ENV"

      - name: Patch and compile combined SSD DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-fourarm
          git -C third_party/DiskANN-fourarm checkout --detach "$rev"
          test "$(git -C third_party/DiskANN-fourarm rev-parse HEAD)" = "$rev"
          echo "$rev" > artifacts/medrag-zipf-four-arm/upstream-commit.txt

          CARGO_HOME="$RUNNER_TEMP/fourarm-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/fourarm-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_paper_catapult.py third_party/DiskANN-fourarm
          (cd third_party/DiskANN-fourarm && cargo fmt --all)
          git -C third_party/DiskANN-fourarm diff --check
          git -C third_party/DiskANN-fourarm diff > artifacts/medrag-zipf-four-arm/combined.patch
          (cd third_party/DiskANN-fourarm && cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/medrag-zipf-four-arm/build.log

          echo "DISKANN_BIN=$PWD/third_party/DiskANN-fourarm/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Four-arm functional smoke
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/medrag-zipf-four-arm-smoke-${GITHUB_RUN_ID}"
          mkdir -p "$work" artifacts/medrag-zipf-four-arm/smoke
          .venv/bin/python scripts/qualify_medrag_zipf_four_arm.py \
            --binary "$DISKANN_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --portal-router "$PORTAL_ROUTER" \
            --work "$work" \
            --out "$PWD/artifacts/medrag-zipf-four-arm/smoke" \
            --max-queries 512 \
            --reps 1 \
            --k-values "1,4,16" \
            2>&1 | tee artifacts/medrag-zipf-four-arm/smoke.log
          rm -rf "$work"

      - name: Full four-arm MedRAG-Zipf sweep
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/medrag-zipf-four-arm-full-${GITHUB_RUN_ID}"
          mkdir -p "$work" artifacts/medrag-zipf-four-arm/full
          .venv/bin/python scripts/qualify_medrag_zipf_four_arm.py \
            --binary "$DISKANN_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --portal-router "$PORTAL_ROUTER" \
            --work "$work" \
            --out "$PWD/artifacts/medrag-zipf-four-arm/full" \
            --reps 3 \
            --k-values "1,2,4,8,16" \
            2>&1 | tee artifacts/medrag-zipf-four-arm/full.log
          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medrag-zipf-four-arm-${{ github.run_id }}
          path: artifacts/medrag-zipf-four-arm/
          retention-days: 30

      - name: Clean toolchain scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/fourarm-cargo-${GITHUB_RUN_ID}" \
                 "$RUNNER_TEMP/fourarm-rustup-${GITHUB_RUN_ID}"
