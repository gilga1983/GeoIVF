name: NavHints native Starling on PubMed and Text2Image
# Reproduce the PubMed and Text2Image native-Starling comparisons by manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starling-first-time-pubmed-t2image
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: [self-hosted, linux, x64, geoivf]
    steps:
      - uses: actions/checkout@v4
      - name: Verify native float MIPS source generation
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/generate_starling_final_core_missing.py scripts/summarize_starling_final_core_missing.py
          python3 scripts/generate_starling_final_core_missing.py pubmed
          python3 scripts/generate_starling_final_core_missing.py text2image
          bash -n scripts/run_starling_final_core_pubmed.generated.sh
          bash -n scripts/run_starling_final_core_text2image.generated.sh
          grep -F 'DIST_FN=mips' scripts/run_starling_final_core_pubmed.generated.sh
          grep -F 'DIST_FN=mips' scripts/run_starling_final_core_text2image.generated.sh
  first-time-native:
    needs: source-check
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dataset: [pubmed, text2image]
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original-native Starling selected Core comparison
        shell: bash
        run: python3 scripts/generate_starling_final_core_missing.py "${{ matrix.dataset }}" --run
      - name: Preserve native Starling raw I/O, latency and source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-starling-table9-${{ matrix.dataset }}
          path: artifacts/starling-final-core-${{ matrix.dataset }}/
          retention-days: 14
      - name: Remove only temporary native index
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/starling-final-core-${{ matrix.dataset }}-$GITHUB_RUN_ID"
