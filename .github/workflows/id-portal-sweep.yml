name: ID-only portal quantity sweep
on:
  push:
    branches: [experiment/id-portal-sweep]
    paths:
      - '.github/workflows/id-portal-sweep.yml'
      - 'scripts/prepare_id_portal_pools.py'
      - 'scripts/patch_diskann_global_starts.py'
      - 'scripts/qualify_id_portal_sweep.py'
      - 'scripts/run_id_portal_sweep_ci.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-id-portal-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ID-only portal sweep
        run: bash scripts/run_id_portal_sweep_ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: id-portal-sweep-${{ github.run_id }}
          path: artifacts/id-portal-sweep/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/idportal-cargo-$GITHUB_RUN_ID"
          rm -rf "$RUNNER_TEMP/idportal-rustup-$GITHUB_RUN_ID"
          rm -f "$RUNNER_TEMP/idportal-rustup-$GITHUB_RUN_ID.sh"
