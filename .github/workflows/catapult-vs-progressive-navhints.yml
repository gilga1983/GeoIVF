name: Catapult vs progressive NavHints
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/catapult-vs-progressive-navhints.yml'
      - 'scripts/run_catapult_vs_progressive_navhints_ci.sh'
      - 'scripts/qualify_catapult_vs_progressive_navhints.py'
      - 'scripts/patch_diskann_progressive_navhints_k16_clean.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_global_starts.py'
      - 'scripts/patch_diskann_catapult_snapshot.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-catapult-vs-progressive
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run current Catapult comparison
        shell: bash
        run: bash scripts/run_catapult_vs_progressive_navhints_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catapult-vs-progressive-${{ github.run_id }}
          path: artifacts/catapult-vs-progressive/
          retention-days: 30
