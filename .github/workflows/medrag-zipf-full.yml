name: Full MedRAG Zipf reconstruction
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/medrag-zipf-full.yml'
      - 'scripts/generate_medrag_zipf_paraphrases.py'
      - 'scripts/analyze_medrag_zipf_paraphrases.py'
      - 'scripts/embed_medrag_zipf_queries.py'
      - 'scripts/prepare_medrag_zipf_identity.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-medrag-zipf-full
  cancel-in-progress: true

jobs:
  full:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      HF_HOME: /home/gilga/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare CUDA environment
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu128
          .venv/bin/pip install transformers==4.49.0 accelerate==1.4.0 safetensors==0.5.3 numpy==2.2.6
          mkdir -p artifacts/medrag-zipf-full
          .venv/bin/python - <<'PY' | tee artifacts/medrag-zipf-full/cuda.txt
          import torch
          assert torch.cuda.is_available()
          print("torch", torch.__version__)
          print("cuda", torch.version.cuda)
          print("gpu", torch.cuda.get_device_name(0))
          print("memory_gib", torch.cuda.get_device_properties(0).total_memory/(1<<30))
          PY

      - name: Prepare persistent identity and paraphrase cache
        run: |
          set -euxo pipefail
          cache="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1"
          identity="$cache/identity"
          mkdir -p "$identity"

          src="$RUNNER_TEMP/mirage-pubmedqa-${GITHUB_RUN_ID}.json"
          curl -fsSL --retry 5 \
            "https://raw.githubusercontent.com/gzxiong/MIRAGE/392943af99cd94cafd50a0de2e7fca24bbf65494/rawdata/pubmedqa/data/test_set.json" \
            -o "$src"

          .venv/bin/python scripts/prepare_medrag_zipf_identity.py \
            --pubmedqa "$src" --out "$identity"
          rm -f "$src"

          echo "ZIPF_CACHE=$cache" >> "$GITHUB_ENV"
          echo "IDENTITY_DIR=$identity" >> "$GITHUB_ENV"
          cp "$identity/identity-manifest.json" artifacts/medrag-zipf-full/

      - name: Generate all 10000 unique paraphrases resumably
        run: |
          set -euxo pipefail
          out="$ZIPF_CACHE/paraphrases.jsonl"
          .venv/bin/python scripts/generate_medrag_zipf_paraphrases.py \
            --stream "$IDENTITY_DIR/stream.jsonl" \
            --out "$out" \
            --model "Qwen/Qwen2.5-3B-Instruct" \
            --revision main \
            --batch-size 12 \
            --seed 424242 \
            2>&1 | tee artifacts/medrag-zipf-full/generation.log

          test "$(wc -l < "$out")" -eq 10000
          cp "$out.manifest.json" artifacts/medrag-zipf-full/paraphrases.manifest.json

      - name: Validate full MedCPT query geometry
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/analyze_medrag_zipf_paraphrases.py \
            --paraphrases "$ZIPF_CACHE/paraphrases.jsonl" \
            --base "$IDENTITY_DIR/base_questions.jsonl" \
            --out artifacts/medrag-zipf-full/quality.json \
            --model "ncbi/MedCPT-Query-Encoder" \
            2>&1 | tee artifacts/medrag-zipf-full/quality.log

      - name: Embed full query stream with MedCPT
        run: |
          set -euxo pipefail
          queryfile="$ZIPF_CACHE/medrag-zipf-10k-medcpt.fbin"
          .venv/bin/python scripts/embed_medrag_zipf_queries.py \
            --paraphrases "$ZIPF_CACHE/paraphrases.jsonl" \
            --out "$queryfile" \
            --model "ncbi/MedCPT-Query-Encoder" \
            2>&1 | tee artifacts/medrag-zipf-full/embed.log
          cp "$queryfile.manifest.json" artifacts/medrag-zipf-full/query-embedding-manifest.json
          sha256sum "$queryfile" > artifacts/medrag-zipf-full/query-fbin-sha256.txt
          git rev-parse HEAD > artifacts/medrag-zipf-full/geoivf-commit.txt

      - name: Preserve compact reconstruction artifact
        run: |
          set -euxo pipefail
          cp "$ZIPF_CACHE/paraphrases.jsonl" artifacts/medrag-zipf-full/
          cp "$IDENTITY_DIR/source_indices.npy" artifacts/medrag-zipf-full/
          cp "$IDENTITY_DIR/base_questions.jsonl" artifacts/medrag-zipf-full/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medrag-zipf-full-${{ github.run_id }}
          path: artifacts/medrag-zipf-full/
          retention-days: 30
