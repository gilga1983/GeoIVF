name: Port NavHints Recent512 to original Starling BigANN-10M
on:
  push:
    branches: [experiment/starling-navhints-recent]
    paths:
      - '.github/workflows/starling-navhints-recent.yml'
      - 'scripts/patch_starling_recent_hints.py'
      - 'scripts/run_starling_navhints_recent_ci.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-starling-portability
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned public BigANN inputs and adapter syntax
        shell: bash
        run: |
          bash -n scripts/run_starling_navhints_recent_ci.sh
          python3 -m py_compile scripts/patch_starling_recent_hints.py
          test -s "$HOME/.cache/geoivf/public-eval/bigann-10M/data/dataset.manifest.json"
          df -h "$RUNNER_TEMP"
      - name: Original Starling baseline vs equal-work random512 and causal Recent512
        shell: bash
        run: bash scripts/run_starling_navhints_recent_ci.sh
      - name: Preserve original source diff, native recall-I/O-latency frontiers and host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starling-navhints-recent
          path: artifacts/starling-navhints-recent/
          retention-days: 30
      - name: Remove only this experiment's source/index scratch
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/starling-navhints-recent-$GITHUB_RUN_ID"
