name: Stop stale memory-frontier runs
on:
  push:
    branches: [experiment/paper-memory-frontier]
    paths:
      - '.github/workflows/stop-stale-memory-frontier.yml'
permissions:
  contents: read
jobs:
  stop:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 5
    steps:
      - name: Stop only intermediate memory-frontier evaluators
        shell: bash
        run: |
          set -x
          pgrep -af 'paper_memory_frontier|paper-memory-frontier|memfront-eval' || true
          pkill -TERM -f 'memfront-eval-37423171419' || true
          pkill -TERM -f 'memfront-eval-37423198648' || true
          sleep 2
          pkill -KILL -f 'memfront-eval-37423171419' || true
          pkill -KILL -f 'memfront-eval-37423198648' || true
          pgrep -af 'paper_memory_frontier|paper-memory-frontier|memfront-eval' || true
