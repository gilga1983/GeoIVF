name: Frozen Catapult heldout comparison
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/frozen-catapult-heldout.yml'
      - 'scripts/patch_diskann_catapult_snapshot.py'
      - 'scripts/patch_diskann_waypoint_cache.py'
      - 'scripts/qualify_frozen_catapult_heldout.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-frozen-catapult-heldout
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight cached inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6
          mkdir -p artifacts/frozen-catapult-heldout

          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/catapult-paper-pubmed1m/throughput-only.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          router="$HOME/.cache/geoivf/pubmed1m-ip-portal-v1/router.bin"
          cache="$HOME/.cache/geoivf/waypoint-k1-v1"

          test -s "$queries"
          test -s "$gt"
          test -s "$router"
          test -s "$cache/global-endpoint-s1.bin"
          test -s "$cache/waypoint-s1.bin"

          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "PORTAL_ROUTER=$router" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$cache" >> "$GITHUB_ENV"

          git rev-parse HEAD > artifacts/frozen-catapult-heldout/geoivf-commit.txt
          sha256sum "$queries" "$router" "$cache/global-endpoint-s1.bin" "$cache/waypoint-s1.bin"             > artifacts/frozen-catapult-heldout/input-sha256.txt

      - name: Patch and compile snapshot-capable DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-frozen-catapult
          git -C third_party/DiskANN-frozen-catapult checkout --detach "$rev"
          test "$(git -C third_party/DiskANN-frozen-catapult rev-parse HEAD)" = "$rev"

          CARGO_HOME="$RUNNER_TEMP/frozen-cat-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/frozen-cat-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME"             sh "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"               -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_catapult_snapshot.py third_party/DiskANN-frozen-catapult
          (cd third_party/DiskANN-frozen-catapult && cargo fmt --all)
          git -C third_party/DiskANN-frozen-catapult diff --check
          git -C third_party/DiskANN-frozen-catapult diff             > artifacts/frozen-catapult-heldout/frozen-catapult.patch
          (cd third_party/DiskANN-frozen-catapult &&             cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee artifacts/frozen-catapult-heldout/build.log

          echo "DISKANN_BIN=$PWD/third_party/DiskANN-frozen-catapult/target/release/diskann-benchmark"             >> "$GITHUB_ENV"

      - name: Train Catapult and evaluate frozen caches
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/frozen-catapult-heldout-${GITHUB_RUN_ID}"
          mkdir -p "$work" artifacts/frozen-catapult-heldout/results

          .venv/bin/python scripts/qualify_frozen_catapult_heldout.py             --binary "$DISKANN_BIN"             --queries "$QUERIES"             --gt "$GT"             --index-prefix "$INDEX_PREFIX"             --portal-router "$PORTAL_ROUTER"             --cache-dir "$CACHE_DIR"             --work "$work"             --out "$PWD/artifacts/frozen-catapult-heldout/results"             --train-rows 5000             --eval-rows 5000             2>&1 | tee artifacts/frozen-catapult-heldout/eval.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-catapult-heldout-${{ github.run_id }}
          path: artifacts/frozen-catapult-heldout/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/frozen-cat-cargo-${GITHUB_RUN_ID}"                  "$RUNNER_TEMP/frozen-cat-rustup-${GITHUB_RUN_ID}"
