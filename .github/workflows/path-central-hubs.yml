name: Traversed central hub winners

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/path-central-hubs.yml'
      - 'scripts/patch_diskann_vertex_trace.py'
      - 'scripts/build_path_central_hub_payloads.py'
      - 'scripts/qualify_path_central_hubs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-path-central-hubs
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/path-central-hubs"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          BASE_PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          BASE_VERTEX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          ROOT="$HOME/.cache/geoivf/path-central-hubs-v1"
          PAYLOADS="$ROOT/payloads"
          START_INDEX="$ROOT/start/diskann-index"
          TRAVERSED_INDEX="$ROOT/traversed/diskann-index"

          mkdir -p "$ART" "$PAYLOADS" "$(dirname "$START_INDEX")" "$(dirname "$TRAVERSED_INDEX")"
          for f in "$QUERIES" "$GT5000" "$ORIG"_disk.index "$ORIG"_pq_pivots.bin "$ORIG"_pq_compressed.bin "$IVF16" "$BASE_PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG=$ORIG" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "BASE_PAYLOAD=$BASE_PAYLOAD" >> "$GITHUB_ENV"
          echo "BASE_VERTEX=$BASE_VERTEX" >> "$GITHUB_ENV"
          echo "PAYLOADS=$PAYLOADS" >> "$GITHUB_ENV"
          echo "START_INDEX=$START_INDEX" >> "$GITHUB_ENV"
          echo "TRAVERSED_INDEX=$TRAVERSED_INDEX" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/patch_diskann_vertex_trace.py             scripts/build_path_central_hub_payloads.py             scripts/qualify_path_central_hubs.py             scripts/embed_vertex_navhints_in_diskann_index.py             scripts/patch_diskann_hub_winners.py             scripts/patch_diskann_result_ids_dump.py

      - name: Ensure baseline vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$BASE_VERTEX"_disk.index ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$BASE_PAYLOAD"               --output-disk-index "$BASE_VERTEX"_disk.index
          fi
          rm -f "$BASE_VERTEX"_pq_pivots.bin "$BASE_VERTEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$BASE_VERTEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$BASE_VERTEX"_pq_compressed.bin

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/pathhub-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/pathhub-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/pathhub-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/pathhub-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build exact support-2 trace producer
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-pathhub-trace
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-pathhub-trace
          git -C third_party/DiskANN-pathhub-trace checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-pathhub-trace --variants 5
          .venv/bin/python scripts/patch_diskann_vertex_trace.py third_party/DiskANN-pathhub-trace
          .venv/bin/python scripts/patch_diskann_result_ids_dump.py third_party/DiskANN-pathhub-trace
          (cd third_party/DiskANN-pathhub-trace && cargo fmt --all)
          git -C third_party/DiskANN-pathhub-trace diff --check
          (cd third_party/DiskANN-pathhub-trace && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/trace-build.log"
          echo "TRACE_BIN=$PWD/third_party/DiskANN-pathhub-trace/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Collect exact warm L160 paths and winners
        run: |
          set -euxo pipefail
          Q="$ART/warm4000.fbin"
          GT="$ART/warm4000.gt"
          .venv/bin/python - "$QUERIES" "$GT5000" "$Q" "$GT" <<'PY'
          import struct,sys
          from pathlib import Path
          qsrc,gsrc,qdst,gdst=map(Path,sys.argv[1:])
          with qsrc.open("rb") as f:
              rows,dim=struct.unpack("<II",f.read(8)); assert rows==10000
              f.seek(8+5000*dim*4); data=f.read(4000*dim*4)
          assert len(data)==4000*dim*4
          with qdst.open("wb") as f:
              f.write(struct.pack("<II",4000,dim));f.write(data)
          raw=gsrc.read_bytes();gr,gk=struct.unpack("<II",raw[:8]);assert gr==5000
          with gdst.open("wb") as f:
              f.write(struct.pack("<II",4000,gk));f.write(raw[8:8+4000*gk*4])
          PY

          .venv/bin/python - "$ART/trace.input.json" "$Q" "$GT" "$BASE_VERTEX" <<'PY'
          import json,sys
          from pathlib import Path
          out,q,gt,prefix=map(Path,sys.argv[1:])
          cfg={"search_directories":[str(out.parent)],"jobs":[{"type":"disk-index","content":{
            "source":{"disk-index-source":"Load","data_type":"float32","load_path":str(prefix)},
            "search_phase":{"queries":str(q),"groundtruth":str(gt),"search_list":[160],
              "beam_width":8,"recall_at":10,"num_threads":4,"is_flat_search":False,
              "distance":"inner_product","vector_filters_file":None,"num_nodes_to_cache":None,
              "search_io_limit":None,"post_processor":None}}}]}
          out.write_text(json.dumps(cfg))
          PY

          export DISKANN_HINT_IVF_FILE="$IVF16"
          export DISKANN_HINT_IVF_NPROBE=8
          export DISKANN_HINT_IVF_MAX_STARTS=1
          export DISKANN_VERTEX_HINT_VARIANT=1
          export DISKANN_VERTEX_TRACE_FILE="$ART/warm-paths.jsonl"
          export DISKANN_RESULT_IDS_FILE="$ART/warm-results.bin"
          exec 9>"$HOME/.cache/geoivf/speed-device.lock"
          flock 9
          "$TRACE_BIN" run             --input-file "$ART/trace.input.json"             --output-file "$ART/trace.output.json"             2>&1 | tee "$ART/trace.log"
          test -s "$ART/warm-paths.jsonl"
          test -s "$ART/warm-results.bin"

      - name: Build paired placement payloads
        run: |
          set -euxo pipefail
          rm -rf "$PAYLOADS"; mkdir -p "$PAYLOADS"
          .venv/bin/python scripts/build_path_central_hub_payloads.py             --base-payload "$BASE_PAYLOAD"             --ivf "$IVF16"             --trace "$ART/warm-paths.jsonl"             --results "$ART/warm-results.bin"             --out-dir "$PAYLOADS"             --warm-rows 4000             2>&1 | tee "$ART/payload-build.log"
          cp "$PAYLOADS/manifest.json" "$ART/payload-manifest.json"

      - name: Embed paired indexes
        run: |
          set -euxo pipefail
          for placement in start traversed; do
            if [ "$placement" = start ]; then PREFIX="$START_INDEX"; else PREFIX="$TRAVERSED_INDEX"; fi
            rm -f "$PREFIX"_disk.index "$PREFIX"_disk.index.manifest.json
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$PAYLOADS/$placement.bin"               --output-disk-index "$PREFIX"_disk.index               2>&1 | tee "$ART/embed-$placement.log"
            rm -f "$PREFIX"_pq_pivots.bin "$PREFIX"_pq_compressed.bin
            ln -s "$ORIG"_pq_pivots.bin "$PREFIX"_pq_pivots.bin
            ln -s "$ORIG"_pq_compressed.bin "$PREFIX"_pq_compressed.bin
            cp "$PREFIX"_disk.index.manifest.json "$ART/index-$placement-manifest.json"
          done

      - name: Build eight-variant evaluator
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-pathhub-eval
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-pathhub-eval
          git -C third_party/DiskANN-pathhub-eval checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-pathhub-eval --variants 8
          .venv/bin/python scripts/patch_diskann_hub_winners.py third_party/DiskANN-pathhub-eval
          (cd third_party/DiskANN-pathhub-eval && cargo fmt --all)
          git -C third_party/DiskANN-pathhub-eval diff --check
          (cd third_party/DiskANN-pathhub-eval && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/eval-build.log"
          echo "EVAL_BIN=$PWD/third_party/DiskANN-pathhub-eval/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Evaluate central placement
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/pathhub-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_path_central_hubs.py             --binary "$EVAL_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --start-index-prefix "$START_INDEX"             --traversed-index-prefix "$TRAVERSED_INDEX"             --ivf-16k "$IVF16"             --manifest "$PAYLOADS/manifest.json"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: path-central-hubs-${{ github.run_id }}
          path: artifacts/path-central-hubs/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pathhub-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/pathhub-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/pathhub-eval-$GITHUB_RUN_ID"
