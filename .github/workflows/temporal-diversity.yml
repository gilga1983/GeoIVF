name: Temporal diversity NavHints screen
on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/temporal-diversity.yml'
      - 'scripts/run_temporal_diversity_ci.sh'
      - 'scripts/learn_temporal_diverse_landmarks.py'
      - 'scripts/qualify_temporal_diversity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-temporal-diversity
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run temporal-diversity screen
        shell: bash
        run: bash scripts/run_temporal_diversity_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-diversity-${{ github.run_id }}
          path: artifacts/temporal-diversity/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/temporal-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/temporal-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/temporal-eval-$GITHUB_RUN_ID"
