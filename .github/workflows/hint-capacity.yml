name: Hint IVF capacity sweep
on:
  push:
    branches: [experiment/hint-capacity]
    paths:
      - '.github/workflows/hint-capacity.yml'
      - 'scripts/run_hint_capacity_ci.sh'
      - 'scripts/qualify_hint_capacity.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/patch_diskann_hint_ivf.py'
      - 'scripts/learn_global_navigation_landmarks.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-hint-capacity
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Hint-IVF capacity sweep
        run: bash scripts/run_hint_capacity_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hint-capacity-${{ github.run_id }}
          path: artifacts/hint-capacity/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hintcap-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintcap-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintcap-eval-$GITHUB_RUN_ID"
