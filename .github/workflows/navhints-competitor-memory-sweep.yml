name: NavHints competitor RAM scaling

on:
  push:
    branches: [experiment/navhints-competitor-memory-sweep]
    paths:
      - '.github/workflows/navhints-competitor-memory-sweep.yml'
      - 'scripts/run_competitor_memory_sweep_ci.sh'
      - 'scripts/qualify_competitor_memory_sweep.py'
      - 'scripts/qualify_frozen_paper_competitors.py'
      - 'scripts/patch_diskann_hot_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-navhints-competitor-memory-sweep
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and measure matched-recall memory scaling
        shell: bash
        run: bash scripts/run_competitor_memory_sweep_ci.sh
      - name: Upload artifacts, including partial results on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navhints-competitor-memory-sweep-${{ github.run_id }}
          path: artifacts/competitor-memory-sweep/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/ramsweep-cargo-$GITHUB_RUN_ID" "$RUNNER_TEMP/ramsweep-rustup-$GITHUB_RUN_ID" "$RUNNER_TEMP/ramsweep-eval-$GITHUB_RUN_ID" "$RUNNER_TEMP/ram-sweep-hot-$GITHUB_RUN_ID" "$RUNNER_TEMP/ramsweep-diskann-cache-$GITHUB_RUN_ID" "$RUNNER_TEMP/ramsweep-diskann-cat-$GITHUB_RUN_ID" "$RUNNER_TEMP/ramsweep-diskann-nav-$GITHUB_RUN_ID"
