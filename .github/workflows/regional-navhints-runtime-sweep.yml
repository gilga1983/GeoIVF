name: Regional NavHints runtime sweep

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/regional-navhints-runtime-sweep.yml'
      - 'scripts/patch_diskann_regional_navhints.py'
      - 'scripts/learn_equal_region_navhints.py'
      - 'scripts/learn_equal_region_navhints_sweep.py'
      - 'scripts/qualify_regional_navhints_runtime.py'
      - 'scripts/qualify_regional_navhints_sweep.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-regional-navhints-runtime-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/regional-navhints-runtime-sweep"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX_PREFIX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          TRACE="$HOME/.cache/geoivf/regional-navhints-runtime-v1/onpolicy-trace/navhints16k-teacher-L64.jsonl"
          ROUTER_ROOT="$HOME/.cache/geoivf/region-ablation-routers-v1"
          ROOT="$HOME/.cache/geoivf/regional-navhints-runtime-sweep-v1"
          REGIONAL_ROOT="$ROOT/maps"

          mkdir -p "$ART" "$REGIONAL_ROOT"
          for f in "$BASE" "$QUERIES" "$GT5000" "$IVF16" "$TRACE"; do test -s "$f"; done
          test "$(wc -l < "$TRACE")" -eq 9000
          for n in 128 256 512; do test -s "$ROUTER_ROOT/nlist-$n/router.bin"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$INDEX_PREFIX" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"
          echo "ROUTER_ROOT=$ROUTER_ROOT" >> "$GITHUB_ENV"
          echo "REGIONAL_ROOT=$REGIONAL_ROOT" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile \
            scripts/patch_diskann_regional_navhints.py \
            scripts/learn_equal_region_navhints.py \
            scripts/learn_equal_region_navhints_sweep.py \
            scripts/qualify_regional_navhints_runtime.py \
            scripts/qualify_regional_navhints_sweep.py

      - name: Build regional map sweep
        run: |
          set -euxo pipefail
          rm -rf "$REGIONAL_ROOT"
          mkdir -p "$REGIONAL_ROOT"
          for n in 128 256 512; do
            out="$REGIONAL_ROOT/n$n"
            mkdir -p "$out"
            .venv/bin/python scripts/learn_equal_region_navhints_sweep.py \
              --base "$BASE" \
              --router "$ROUTER_ROOT/nlist-$n/router.bin" \
              --trace "$TRACE" \
              --out-dir "$out" \
              --per-regions "8,16" \
              --min-entry-pos 8 \
              --threads 4 \
              2>&1 | tee "$ART/learn-$n.log"
            for h in 8 16; do
              test -s "$out/regional-${n}x${h}.bin"
              cp "$out/regional-${n}x${h}.bin.manifest.json" \
                "$ART/regional-${n}x${h}.manifest.json"
              cp "$out/regional-${n}x${h}.bin" "$REGIONAL_ROOT/"
            done
          done
          sha256sum "$REGIONAL_ROOT"/regional-*.bin > "$ART/maps.sha256"

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/regional-sweep-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/regional-sweep-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/regional-sweep-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/regional-sweep-rustup-$GITHUB_RUN_ID.sh" \
            -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build regional runtime DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-regional-sweep
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-regional-sweep
          git -C third_party/DiskANN-regional-sweep checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_regional_navhints.py third_party/DiskANN-regional-sweep
          (cd third_party/DiskANN-regional-sweep && cargo fmt --all)
          git -C third_party/DiskANN-regional-sweep diff --check
          git -C third_party/DiskANN-regional-sweep diff > "$ART/regional-runtime.patch"
          (cd third_party/DiskANN-regional-sweep && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-regional-sweep/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Run six-arm regional parameter sweep
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/regional-sweep-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_regional_navhints_sweep.py \
            --binary "$RUNTIME_BIN" \
            --queries "$QUERIES" \
            --gt5000 "$GT5000" \
            --index-prefix "$INDEX_PREFIX" \
            --ivf-16k "$IVF16" \
            --regional-root "$REGIONAL_ROOT" \
            --work "$WORK" \
            --out "$OUT" \
            --reps 3 \
            2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-navhints-runtime-sweep-${{ github.run_id }}
          path: artifacts/regional-navhints-runtime-sweep/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/regional-sweep-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/regional-sweep-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/regional-sweep-eval-$GITHUB_RUN_ID"
