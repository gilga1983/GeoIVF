name: Landmark teacher ablation
on:
  push:
    branches: [experiment/landmark-teacher-ablation]
    paths:
      - '.github/workflows/landmark-teacher-ablation.yml'
      - 'scripts/run_landmark_teacher_ablation_ci.sh'
      - 'scripts/collect_medoid_navigation_traces.py'
      - 'scripts/qualify_landmark_teacher_ablation.py'
      - 'scripts/learn_global_navigation_landmarks.py'
      - 'scripts/patch_diskann_global_starts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-landmark-teacher-ablation
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run teacher ablation
        run: bash scripts/run_landmark_teacher_ablation_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landmark-teacher-ablation-${{ github.run_id }}
          path: artifacts/landmark-teacher-ablation/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/teacher-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/teacher-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/teacher-eval-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/teacher-medoid-trace-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/teacher-portal-trace-$GITHUB_RUN_ID"
