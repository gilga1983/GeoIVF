name: Fixed-memory hierarchical region maps

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/hierarchical-region-maps.yml'
      - 'scripts/analyze_hierarchical_region_maps.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-hierarchical-region-maps
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fixed-memory hierarchy diagnostic
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/hierarchical-region-maps"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          TRACE="$HOME/.cache/geoivf/high-l-medoid-teacher-traces-10k-v1/medoid-teacher.L64.jsonl"
          ROUTER_ROOT="$HOME/.cache/geoivf/region-ablation-routers-v1"

          mkdir -p "$ART"
          for f in "$BASE" "$QUERIES" "$TRACE"; do test -s "$f"; done
          for n in 64 128 256 512; do test -s "$ROUTER_ROOT/nlist-$n/router.bin"; done

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile scripts/analyze_hierarchical_region_maps.py

          .venv/bin/python scripts/analyze_hierarchical_region_maps.py \
            --base "$BASE" \
            --queries "$QUERIES" \
            --trace "$TRACE" \
            --router-root "$ROUTER_ROOT" \
            --levels "64,128,256,512" \
            --train-queries 9000 \
            --min-entry-pos 8 \
            --budgets "2048,4096,8192" \
            --per-state-cap 16 \
            --thresholds "32,64,128,256" \
            --out "$ART/hierarchical-region-maps.json" \
            2>&1 | tee "$ART/diagnostic.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hierarchical-region-maps-${{ github.run_id }}
          path: artifacts/hierarchical-region-maps/
          retention-days: 30
