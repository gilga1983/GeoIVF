name: Diagnose Starling NavHints entry headroom and CPU

on:
  push:
    branches: [experiment/starling-entry-diagnostics]
    paths:
      - '.github/workflows/starling-entry-diagnostics.yml'
      - 'scripts/patch_starling_entry_diagnostics.py'
      - 'scripts/generate_starling_entry_diagnostic.py'
      - 'scripts/summarize_starling_entry_diagnostics.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-starling-entry-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify diagnostics and self-hosted dataset
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/patch_starling_entry_diagnostics.py \
            scripts/generate_starling_entry_diagnostic.py \
            scripts/summarize_starling_entry_diagnostics.py \
            scripts/patch_starling_recent_hints.py \
            scripts/patch_starling_native_junctions.py
          python3 scripts/generate_starling_entry_diagnostic.py
          test -s "$HOME/.cache/geoivf/public-eval/bigann-10M/data/dataset.manifest.json"
          df -h "$RUNNER_TEMP"
      - name: Compare native Starling, score-only, Full Core and oracle entry
        shell: bash
        run: python3 scripts/generate_starling_entry_diagnostic.py --run
      - name: Save native search paths, source diffs and query diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starling-entry-diagnostics
          path: artifacts/starling-entry-diagnostics/
          retention-days: 30
      - name: Remove only this run's scratch, retain datasets and project files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/starling-entry-diagnostics-$GITHUB_RUN_ID"
