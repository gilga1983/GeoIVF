name: Oracle semantic result cache

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/oracle-semantic-cache.yml'
      - 'scripts/build_oracle_semantic_cache_starts.py'
      - 'scripts/qualify_oracle_semantic_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-oracle-semantic-cache
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/oracle-semantic-cache"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          ROOT="$HOME/.cache/geoivf/oracle-semantic-cache-v1"
          SEEDS="$ROOT/seeds"

          mkdir -p "$ART" "$SEEDS"
          for f in "$QUERIES" "$GT5000" "$IVF16" "$INDEX"_disk.index "$INDEX"_pq_pivots.bin "$INDEX"_pq_compressed.bin; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "SEEDS=$SEEDS" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/build_oracle_semantic_cache_starts.py             scripts/qualify_oracle_semantic_cache.py             scripts/collect_navhints_heldout_traces.py             scripts/patch_diskann_navhints_trace.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/semcache-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/semcache-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/semcache-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/semcache-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build trace and custom-start DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-semcache
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-semcache
          git -C third_party/DiskANN-semcache checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_navhints_trace.py third_party/DiskANN-semcache
          (cd third_party/DiskANN-semcache && cargo fmt --all)
          git -C third_party/DiskANN-semcache diff --check
          (cd third_party/DiskANN-semcache && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-semcache/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Recover deployed NavHint starts
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/semcache-trace-$GITHUB_RUN_ID"
          TRACES="$ART/traces"
          rm -rf "$WORK" "$TRACES"; mkdir -p "$WORK" "$TRACES"
          .venv/bin/python scripts/collect_navhints_heldout_traces.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --index-prefix "$INDEX"             --start-ivf "$IVF16"             --work "$WORK"             --out "$TRACES"             --start-row 9000             --rows 1000             2>&1 | tee "$ART/trace.log"
          rm -rf "$WORK"
          test -s "$TRACES/heldout.L40.jsonl"

      - name: Build oracle semantic-cache starts
        run: |
          set -euxo pipefail
          rm -rf "$SEEDS"; mkdir -p "$SEEDS"
          .venv/bin/python scripts/build_oracle_semantic_cache_starts.py             --queries "$QUERIES"             --gt5000 "$GT5000"             --trace "$ART/traces/heldout.L40.jsonl"             --out-dir "$SEEDS"             --capacities "128,256,512,1024,2048,4000"             --result-counts "2,4,10"             2>&1 | tee "$ART/cache-build.log"
          cp "$SEEDS/manifest.json" "$ART/cache-manifest.json"

      - name: Run upper-bound cache screen
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/semcache-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_oracle_semantic_cache.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$INDEX"             --seed-dir "$SEEDS"             --manifest "$SEEDS/manifest.json"             --work "$WORK"             --out "$OUT"             --reps 2             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-semantic-cache-${{ github.run_id }}
          path: artifacts/oracle-semantic-cache/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/semcache-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semcache-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semcache-trace-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semcache-eval-$GITHUB_RUN_ID"
