name: Reviewer defense diagnostics

on:
  push:
    branches: [experiment/reviewer-defense]
    paths:
      - '.github/workflows/reviewer-defense.yml'
      - 'scripts/run_reviewer_defense_ci.sh'
      - 'scripts/qualify_reviewer_defense.py'
      - 'scripts/patch_diskann_experience_core.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-reviewer-defense
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reviewer-defense diagnostics
        run: bash scripts/run_reviewer_defense_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-defense-\${{ github.run_id }}
          path: artifacts/reviewer-defense/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/reviewerdef-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/reviewerdef-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/reviewer-defense-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/reviewer-defense-heldout-$GITHUB_RUN_ID.fbin"
