name: Final NavHints Core on original native Starling

on:
  push:
    branches: [experiment/navhints-final-core-starling-20261011]
    paths:
      - ".github/workflows/starling-final-core-native.yml"
      - "scripts/patch_starling_final_core.py"
      - "scripts/generate_starling_final_core.py"
      - "scripts/summarize_starling_final_core.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-final-core-native-starling
  cancel-in-progress: false

jobs:
  final-native-starling:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dataset: [coveo, bigann]
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate pinned original Starling final routing change (syntax and source guards)
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            scripts/patch_starling_final_core.py \
            scripts/generate_starling_final_core.py \
            scripts/summarize_starling_final_core.py
          python3 scripts/generate_starling_final_core.py "${{ matrix.dataset }}"
          bash -n "scripts/run_starling_final_core_${{ matrix.dataset }}.generated.sh"
          grep -F 'STARLING_FINAL_TRAIN_ONLY_TOP14464_VERIFIED' scripts/generate_starling_final_core.py
      - name: Benchmark selected Core in original native Starling on same frozen index
        shell: bash
        run: python3 scripts/generate_starling_final_core.py "${{ matrix.dataset }}" --run
      - name: Preserve native paper SSD, route traces, trained 14K directory and raw comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "native-starling-final-core-${{ matrix.dataset }}"
          path: "artifacts/starling-final-core-${{ matrix.dataset }}/"
          retention-days: 14
      - name: Clean only isolated original-Starling test
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/starling-final-core-${{ matrix.dataset }}-$GITHUB_RUN_ID"
