name: Frozen cache exact recall validation
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/frozen-cache-recall.yml'
      - 'scripts/prepare_medrag_pubmed1m_exact_gt.py'
      - 'scripts/qualify_frozen_catapult_recall.py'
      - 'scripts/patch_diskann_catapult_snapshot.py'
      - 'scripts/patch_diskann_waypoint_cache.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-frozen-cache-recall
  cancel-in-progress: true

jobs:
  recall:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Python and cached inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"
          mkdir -p artifacts/frozen-cache-recall

          base="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          router="$HOME/.cache/geoivf/pubmed1m-ip-portal-v1/router.bin"
          cache="$HOME/.cache/geoivf/waypoint-k1-v1"
          gt="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"

          test -s "$base"
          test -s "$queries"
          test -s "$router"
          test -s "$cache/global-endpoint-s1.bin"
          test -s "$cache/waypoint-s1.bin"

          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "PORTAL_ROUTER=$router" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$cache" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"

      - name: Build exact heldout PubMed1M ground truth
        run: |
          set -euxo pipefail
          if [ ! -s "$GT" ] || [ ! -s "$GT.manifest.json" ]; then
            rm -f "$GT" "$GT.manifest.json"
            OMP_NUM_THREADS=16 OPENBLAS_NUM_THREADS=16 MKL_NUM_THREADS=16               .venv/bin/python scripts/prepare_medrag_pubmed1m_exact_gt.py                 --base "$BASE"                 --queries "$QUERIES"                 --out "$GT"                 --query-start 5000                 --query-count 5000                 --k 16                 --threads 16                 2>&1 | tee artifacts/frozen-cache-recall/gt-build.log
          fi
          cp "$GT.manifest.json" artifacts/frozen-cache-recall/gt.manifest.json
          sha256sum "$GT" > artifacts/frozen-cache-recall/gt-sha256.txt

      - name: Patch and compile snapshot-capable DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-recall
          git -C third_party/DiskANN-recall checkout --detach "$rev"
          test "$(git -C third_party/DiskANN-recall rev-parse HEAD)" = "$rev"

          CARGO_HOME="$RUNNER_TEMP/recall-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/recall-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME"             sh "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"               -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_catapult_snapshot.py third_party/DiskANN-recall
          (cd third_party/DiskANN-recall && cargo fmt --all)
          git -C third_party/DiskANN-recall diff --check
          (cd third_party/DiskANN-recall &&             cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee artifacts/frozen-cache-recall/build.log

          echo "DISKANN_BIN=$PWD/third_party/DiskANN-recall/target/release/diskann-benchmark"             >> "$GITHUB_ENV"

      - name: Validate exact recall on heldout suffix
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/frozen-cache-recall-${GITHUB_RUN_ID}"
          mkdir -p "$work" artifacts/frozen-cache-recall/results

          .venv/bin/python scripts/qualify_frozen_catapult_recall.py             --binary "$DISKANN_BIN"             --queries "$QUERIES"             --gt "$GT"             --index-prefix "$INDEX_PREFIX"             --portal-router "$PORTAL_ROUTER"             --cache-dir "$CACHE_DIR"             --work "$work"             --out "$PWD/artifacts/frozen-cache-recall/results"             2>&1 | tee artifacts/frozen-cache-recall/recall.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-cache-recall-${{ github.run_id }}
          path: artifacts/frozen-cache-recall/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/recall-cargo-${GITHUB_RUN_ID}"                  "$RUNNER_TEMP/recall-rustup-${GITHUB_RUN_ID}"
