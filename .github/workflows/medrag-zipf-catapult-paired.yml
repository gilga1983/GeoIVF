name: MedRAG Zipf Catapult paired confirmation
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/medrag-zipf-catapult-paired.yml'
      - 'scripts/qualify_medrag_zipf_catapult_paired.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-medrag-zipf-catapult-paired
  cancel-in-progress: true

jobs:
  paired:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight cached artifacts
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6
          mkdir -p artifacts/medrag-zipf-catapult-paired

          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/catapult-paper-pubmed1m/throughput-only.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          router="$HOME/.cache/geoivf/pubmed1m-ip-portal-v1/router.bin"

          test -s "$queries"
          test -s "$gt"
          test -s "$router"

          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "PORTAL_ROUTER=$router" >> "$GITHUB_ENV"

          sha256sum "$queries" "$router" > artifacts/medrag-zipf-catapult-paired/input-sha256.txt
          git rev-parse HEAD > artifacts/medrag-zipf-catapult-paired/geoivf-commit.txt
          { lscpu; free -h; df -h; } > artifacts/medrag-zipf-catapult-paired/host.txt

      - name: Patch and compile combined SSD DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-paired
          git -C third_party/DiskANN-paired checkout --detach "$rev"
          test "$(git -C third_party/DiskANN-paired rev-parse HEAD)" = "$rev"

          CARGO_HOME="$RUNNER_TEMP/paired-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/paired-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/rustup-${GITHUB_RUN_ID}.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_paper_catapult.py third_party/DiskANN-paired
          (cd third_party/DiskANN-paired && cargo fmt --all)
          git -C third_party/DiskANN-paired diff --check
          (cd third_party/DiskANN-paired && cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/medrag-zipf-catapult-paired/build.log

          echo "DISKANN_BIN=$PWD/third_party/DiskANN-paired/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Run order-balanced Catapult pair
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/medrag-zipf-paired-${GITHUB_RUN_ID}"
          mkdir -p "$work" artifacts/medrag-zipf-catapult-paired/results

          .venv/bin/python scripts/qualify_medrag_zipf_catapult_paired.py \
            --binary "$DISKANN_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --portal-router "$PORTAL_ROUTER" \
            --work "$work" \
            --out "$PWD/artifacts/medrag-zipf-catapult-paired/results" \
            --k-values "1,2,4,8,16" \
            --cycles 5 \
            --cooldown-seconds 0.75 \
            2>&1 | tee artifacts/medrag-zipf-catapult-paired/paired.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medrag-zipf-catapult-paired-${{ github.run_id }}
          path: artifacts/medrag-zipf-catapult-paired/
          retention-days: 30

      - name: Clean toolchain scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/paired-cargo-${GITHUB_RUN_ID}" \
                 "$RUNNER_TEMP/paired-rustup-${GITHUB_RUN_ID}"
