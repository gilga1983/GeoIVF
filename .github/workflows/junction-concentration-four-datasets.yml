name: Four-dataset DiskANN opportunity
on:
  push:
    branches: [experiment/motivation-four-datasets]
    paths:
      - '.github/workflows/junction-concentration-four-datasets.yml'
      - 'scripts/analyze_junction_concentration_heldout.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-junction-concentration-four-datasets
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate cached dataset inputs
        run: |
          set -euxo pipefail
          python -m pip install numpy==2.2.6
          ART="$PWD/artifacts/junction-concentration-four"
          mkdir -p "$ART"
          printf 'geoivf_sha=%s\n' "$(git rev-parse HEAD)" > "$ART/run-manifest.txt"
          printf 'diskann_sha=%s\n' "fcf90534174cf29c78c9f13b4cccf1fcabff85f5" >> "$ART/run-manifest.txt"
          for DS in text2image-10M bigann-10M; do
            ROOT="$HOME/.cache/geoivf/public-eval/$DS"
            test -s "$ROOT/data/dataset.manifest.json"
            test -s "$ROOT/index/diskann-index.complete.json"
          done
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/train.fbin"
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/train.gt"
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/index/diskann-index.complete.json"
          test -s "$HOME/.cache/geoivf/high-l-medoid-teacher-traces-v1/medoid-teacher.L64.jsonl"
      - name: Build pinned traversal recorder
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/motivation-four-$GITHUB_RUN_ID"
          mkdir -p "$WORK"
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git "$WORK/DiskANN"
          git -C "$WORK/DiskANN" checkout --detach "$rev"
          export CARGO_HOME="$RUNNER_TEMP/motivation-four-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/motivation-four-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$WORK/rustup.sh"
          sh "$WORK/rustup.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          python scripts/patch_diskann_waypoint_trace.py "$WORK/DiskANN"
          (cd "$WORK/DiskANN" && cargo fmt --all && git diff --check && cargo build --release --locked -p diskann-benchmark --features disk-index)
          echo "OPP_BIN=$WORK/DiskANN/target/release/diskann-benchmark" >> "$GITHUB_ENV"
      - name: Collect matching L64 traces and analyze independent holdout
        run: |
          set -euxo pipefail
          ART="$PWD/artifacts/junction-concentration-four"
          OUT="$ART/curves"
          mkdir -p "$OUT"
          python scripts/analyze_junction_concentration_heldout.py \
            --dataset pubmed1M --trace "$HOME/.cache/geoivf/high-l-medoid-teacher-traces-v1/medoid-teacher.L64.jsonl" \
            --corpus-size 1000000 --train-rows 2500 --total-rows 5000 --skip-prefix 20 --out "$OUT"

          CROOT="$HOME/.cache/geoivf/coveo-real-demand-v1"
          CTRACE="$CROOT/motivation-L64"
          mkdir -p "$CTRACE"
          python scripts/collect_navigation_trace_generic.py \
            --binary "$OPP_BIN" --queries "$CROOT/split/train.fbin" \
            --gt "$CROOT/split/train.gt" --index-prefix "$CROOT/index/diskann-index" \
            --data-type float32 --distance inner_product \
            --train-rows 5000 --teacher-l 64 \
            --work "$RUNNER_TEMP/motivation-four-coveo-work-$GITHUB_RUN_ID" --out "$CTRACE" \
            2>&1 | tee "$ART/coveo-collect.log"
          python scripts/analyze_junction_concentration_heldout.py \
            --dataset coveo --trace "$CTRACE/teacher.jsonl" --corpus-size 31950 \
            --train-rows 2500 --total-rows 5000 --skip-prefix 20 --out "$OUT"

          for DS in text2image-10M bigann-10M; do
            ROOT="$HOME/.cache/geoivf/public-eval/$DS"
            DATA="$ROOT/data"
            PREFIX="$ROOT/index/diskann-index"
            TRACE="$ROOT/motivation-L64"
            mkdir -p "$TRACE"
            readarray -t FIELDS < <(python - "$DATA/dataset.manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          print(m['files']['queries'])
          print(m['files']['heldout5000_gt'])
          print(m['data_type'])
          print(m['metric'])
          PY
            )
            python scripts/collect_navigation_trace_generic.py \
              --binary "$OPP_BIN" --queries "${FIELDS[0]}" --gt "${FIELDS[1]}" \
              --index-prefix "$PREFIX" --data-type "${FIELDS[2]}" --distance "${FIELDS[3]}" \
              --train-rows 5000 --teacher-l 64 \
              --work "$RUNNER_TEMP/motivation-four-$DS-work-$GITHUB_RUN_ID" --out "$TRACE" \
              2>&1 | tee "$ART/$DS-collect.log"
            python scripts/analyze_junction_concentration_heldout.py \
              --dataset "$DS" --trace "$TRACE/teacher.jsonl" --corpus-size 10000000 \
              --train-rows 2500 --total-rows 5000 --skip-prefix 20 --out "$OUT"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junction-concentration-four
          path: artifacts/junction-concentration-four/
          retention-days: 30
      - name: Clean per-run scratch
        if: always()
        run: |
          for p in "$RUNNER_TEMP"/motivation-four-*-"$GITHUB_RUN_ID" \
                   "$RUNNER_TEMP"/motivation-four-"$GITHUB_RUN_ID"; do
            if [ -d "$p" ]; then rm -rf "$p"; fi
          done
