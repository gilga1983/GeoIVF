name: Linear-scale junction concentration (four datasets)
on:
  push:
    branches: [experiment/motivation-four-datasets]
    paths:
      - '.github/workflows/junction-concentration-four-datasets.yml'
      - 'scripts/analyze_junction_concentration_linear.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-junction-concentration-linear
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Analyze existing L64 traces with zero-visit tie policy
        run: |
          set -euxo pipefail
          ART="$PWD/artifacts/junction-concentration-linear"
          mkdir -p "$ART/curves"
          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          ROOT="$HOME/.cache/geoivf"
          P="$ROOT/high-l-medoid-teacher-traces-v1/medoid-teacher.L64.jsonl"
          C="$ROOT/coveo-real-demand-v1/motivation-L64/teacher.jsonl"
          test -s "$P"
          test -s "$C"
          python3 scripts/analyze_junction_concentration_linear.py \
            --dataset pubmed1M --trace "$P" --corpus-size 1000000 \
            --out "$ART/curves" 2>&1 | tee "$ART/pubmed1M.log"
          python3 scripts/analyze_junction_concentration_linear.py \
            --dataset coveo --trace "$C" --corpus-size 31950 \
            --out "$ART/curves" 2>&1 | tee "$ART/coveo.log"
          for DS in text2image-10M bigann-10M; do
            T="$ROOT/public-eval/$DS/motivation-L64/teacher.jsonl"
            test -s "$T"
            python3 scripts/analyze_junction_concentration_linear.py \
              --dataset "$DS" --trace "$T" --corpus-size 10000000 \
              --out "$ART/curves" 2>&1 | tee "$ART/$DS.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junction-concentration-linear
          path: artifacts/junction-concentration-linear/
          retention-days: 30
