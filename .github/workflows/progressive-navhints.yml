name: Progressive retained NavHints
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-progressive-navhints
  cancel-in-progress: true

jobs:
  progressive:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run progressive NavHints
        shell: bash
        run: bash scripts/run_progressive_navhints_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progressive-navhints-${{ github.run_id }}
          path: artifacts/progressive-navhints/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/progressive-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/progressive-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/progressive-eval-$GITHUB_RUN_ID"
