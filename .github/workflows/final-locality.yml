name: Final NavHints locality sweep

on:
  push:
    branches: [experiment/final-locality]
    paths:
      - '.github/workflows/final-locality.yml'
      - 'scripts/run_final_locality_ci.sh'
      - 'scripts/qualify_final_locality.py'
      - 'scripts/patch_diskann_experience_core.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-final-locality
  cancel-in-progress: true

jobs:
  locality:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run final locality sweep
        shell: bash
        run: bash scripts/run_final_locality_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-locality-${{ github.run_id }}
          path: artifacts/final-locality/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/finalloc-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/finalloc-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/final-locality-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/final-locality-heldout-$GITHUB_RUN_ID.fbin"
