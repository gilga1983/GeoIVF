name: Released DiskANN3 held-out comparison
on:
  push:
    branches: [experiment/external-disk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-speed-qualification
  cancel-in-progress: false
jobs:
  diskann:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Environment and our production-path tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p artifacts/external-disk
          git rev-parse HEAD > artifacts/external-disk/commit.txt
          git archive --format=zip HEAD > artifacts/external-disk/source.zip
          { uname -a; lscpu; lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS; uptime; } > artifacts/external-disk/host.txt
          bash scripts/build_execution.sh --uring > artifacts/external-disk/our-build.log 2>&1
          GEOIVF_TEST_DIRECT=1 GEOIVF_TEST_URING=1 .venv/bin/python -m pytest -q --junitxml=artifacts/external-disk/tests.xml
          .venv/bin/python scripts/fetch_sift1m.py --report artifacts/external-disk/dataset.json
      - name: Build pinned current DiskANN3 without changing upstream code
        run: |
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN3
          git -C third_party/DiskANN3 checkout --detach "$rev"
          git -C third_party/DiskANN3 rev-parse HEAD > artifacts/external-disk/upstream-commit.txt
          export CARGO_HOME="$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh"
          sh "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export PATH="$CARGO_HOME/bin:$PATH"
          export RUSTFLAGS='-C target-cpu=native'
          (cd third_party/DiskANN3 && cargo build --locked --release -p diskann-benchmark --features disk-index) 2>&1 | tee artifacts/external-disk/upstream-build.log
          third_party/DiskANN3/target/release/diskann-benchmark inputs disk-index > artifacts/external-disk/upstream-input-schema.txt
      - name: Calibrate on development queries then freeze and evaluate held-out
        run: |
          .venv/bin/python scripts/qualify_external_disk.py \
            --binary "$PWD/third_party/DiskANN3/target/release/diskann-benchmark" \
            --work "$RUNNER_TEMP/geoivf-external-disk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out artifacts/external-disk/results --queries 256 --development 128 --repeats 3 \
            2>&1 | tee artifacts/external-disk/qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-disk-${{ github.run_id }}
          path: artifacts/external-disk/
          retention-days: 30
      - name: Remove only this run's private temporary files
        if: always()
        run: |
          for work in "$RUNNER_TEMP/geoivf-external-disk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}" "$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"; do
            case "$work" in "$RUNNER_TEMP"/geoivf-*) rm -rf -- "$work" ;; *) exit 1 ;; esac
          done
