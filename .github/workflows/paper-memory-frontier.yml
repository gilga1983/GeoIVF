name: NavHints paper memory frontier
on:
  push:
    branches: [experiment/paper-memory-frontier]
    paths:
      - '.github/workflows/paper-memory-frontier.yml'
      - 'scripts/run_paper_memory_frontier_ci.sh'
      - 'scripts/qualify_paper_memory_frontier.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_progressive_navhints.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/learn_global_navigation_landmarks.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-progressive-memory-frontier
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run current-algorithm memory frontier
        run: bash scripts/run_paper_memory_frontier_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-memory-frontier-${{ github.run_id }}
          path: artifacts/paper-memory-frontier/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/memfront-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/memfront-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/memfront-eval-$GITHUB_RUN_ID"
