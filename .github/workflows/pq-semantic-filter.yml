name: PQ semantic filter screen

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/pq-semantic-filter.yml'
      - 'scripts/collect_navhints_heldout_traces.py'
      - 'scripts/analyze_pq_semantic_filter.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-pq-semantic-filter
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/pq-semantic-filter"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          DISK="$INDEX"_disk.index
          PIVOTS="$INDEX"_pq_pivots.bin
          CODES="$INDEX"_pq_compressed.bin
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          CACHE="$HOME/.cache/geoivf/pq-semantic-filter-v1"
          EPS="$CACHE/pubmed1m-pq-epsilon.npy"

          mkdir -p "$ART" "$CACHE"
          for f in "$BASE" "$QUERIES" "$GT5000" "$DISK" "$PIVOTS" "$CODES" "$IVF16"; do
            test -s "$f"
          done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "DISK=$DISK" >> "$GITHUB_ENV"
          echo "PIVOTS=$PIVOTS" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "EPS=$EPS" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile             scripts/collect_navhints_heldout_traces.py             scripts/analyze_pq_semantic_filter.py             scripts/patch_diskann_navhints_trace.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/pqfilter-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/pqfilter-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/pqfilter-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/pqfilter-rustup-$GITHUB_RUN_ID.sh"             -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build trace-enabled DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-pq-filter
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-pq-filter
          git -C third_party/DiskANN-pq-filter checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_navhints_trace.py third_party/DiskANN-pq-filter
          (cd third_party/DiskANN-pq-filter && cargo fmt --all)
          git -C third_party/DiskANN-pq-filter diff --check
          (cd third_party/DiskANN-pq-filter &&             cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "TRACE_BIN=$PWD/third_party/DiskANN-pq-filter/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Collect final-1K held-out traces
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/pqfilter-trace-$GITHUB_RUN_ID"
          TRACES="$ART/traces"
          rm -rf "$WORK" "$TRACES"
          mkdir -p "$WORK" "$TRACES"
          .venv/bin/python scripts/collect_navhints_heldout_traces.py             --binary "$TRACE_BIN"             --queries "$QUERIES"             --index-prefix "$INDEX"             --start-ivf "$IVF16"             --work "$WORK"             --out "$TRACES"             --start-row 9000             --rows 1000             2>&1 | tee "$ART/trace.log"
          rm -rf "$WORK"

      - name: Analyze certified PQ filters
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/analyze_pq_semantic_filter.py             --base "$BASE"             --queries "$QUERIES"             --gt5000 "$GT5000"             --pq-pivots "$PIVOTS"             --pq-codes "$CODES"             --disk-index "$DISK"             --trace-dir "$ART/traces"             --epsilon-cache "$EPS"             --query-offset 9000             --gt-offset 4000             --k 10             --out "$ART/pq-semantic-filter.json"             2>&1 | tee "$ART/analyze.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pq-semantic-filter-${{ github.run_id }}
          path: artifacts/pq-semantic-filter/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pqfilter-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/pqfilter-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/pqfilter-trace-$GITHUB_RUN_ID"
