name: Starling native Coveo locality and complementary entries

on:
  push:
    branches: [experiment/starling-coveo-coverage]
    paths:
      - '.github/workflows/starling-coveo-coverage.yml'
      - 'scripts/patch_starling_coveo_coverage.py'
      - 'scripts/generate_starling_coveo_coverage.py'
      - 'scripts/summarize_starling_coveo_coverage.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-starling-coveo-locality
  cancel-in-progress: false

jobs:
  native-coveo:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen licensed Coveo manifest and seven-arm native code
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/patch_starling_recent_hints.py \
            scripts/patch_starling_native_junctions.py \
            scripts/patch_starling_entry_diagnostics.py \
            scripts/patch_starling_selective_diverse.py \
            scripts/patch_starling_coveo_coverage.py \
            scripts/generate_starling_entry_diagnostic.py \
            scripts/generate_starling_selective_diverse.py \
            scripts/generate_starling_coveo_coverage.py \
            scripts/summarize_starling_coveo_coverage.py
          python3 scripts/generate_starling_coveo_coverage.py
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/dataset.manifest.json"
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/replay.gt"
          df -h "$RUNNER_TEMP"
      - name: Original Starling 7-arm causal real-Coveo experiment
        shell: bash
        run: python3 scripts/generate_starling_coveo_coverage.py --run
      - name: Preserve source diffs, timestamps, original native recall, I/O and latency
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starling-coveo-coverage
          path: artifacts/starling-coveo-coverage/
          retention-days: 30
      - name: Delete only temporary native build from this run
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/starling-coveo-coverage-$GITHUB_RUN_ID"
