name: Demand-adaptive map resolution

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/demand-adaptive-resolution.yml'
      - 'scripts/analyze_demand_adaptive_resolution.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-demand-adaptive-resolution
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run demand-adaptive resolution study
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/demand-adaptive-resolution"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          TRACE="$HOME/.cache/geoivf/high-l-medoid-teacher-traces-10k-v1/medoid-teacher.L64.jsonl"
          ROUTER_ROOT="$HOME/.cache/geoivf/region-ablation-routers-v1"

          mkdir -p "$ART"
          for f in "$BASE" "$QUERIES" "$TRACE"; do test -s "$f"; done
          for n in 64 128 256 512; do test -s "$ROUTER_ROOT/nlist-$n/router.bin"; done

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile scripts/analyze_demand_adaptive_resolution.py

          .venv/bin/python scripts/analyze_demand_adaptive_resolution.py \
            --base "$BASE" \
            --queries "$QUERIES" \
            --trace "$TRACE" \
            --router-root "$ROUTER_ROOT" \
            --levels "64,128,256,512" \
            --train-queries 9000 \
            --min-entry-pos 8 \
            --budgets "2048,4096,8192" \
            --per-state-cap 16 \
            --out "$ART/demand-adaptive-resolution.json" \
            2>&1 | tee "$ART/diagnostic.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demand-adaptive-resolution-${{ github.run_id }}
          path: artifacts/demand-adaptive-resolution/
          retention-days: 30
