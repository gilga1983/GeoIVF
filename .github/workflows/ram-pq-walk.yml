name: Seeded RAM PQ walk screen

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/ram-pq-walk.yml'
      - 'scripts/extract_compact_pq_graph.py'
      - 'scripts/generate_ram_pq_walk_seeds.py'
      - 'scripts/qualify_ram_pq_walk_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-ram-pq-walk
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/ram-pq-walk"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          PIVOTS="$INDEX"_pq_pivots.bin
          CODES="$INDEX"_pq_compressed.bin
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          HNSW="$HOME/.cache/geoivf/pq-reconstruction-ann-v1/pubmed1m-pq-reconstruction-hnsw-M16.index"
          ROOT="$HOME/.cache/geoivf/ram-pq-walk-v1"
          GRAPHROOT="$ROOT/graphs"
          SEEDROOT="$ROOT/seeds-d16"

          mkdir -p "$ART" "$ROOT" "$GRAPHROOT" "$SEEDROOT"
          for f in "$BASE" "$QUERIES" "$GT5000" "$PIVOTS" "$CODES" "$IVF16"; do test -s "$f"; done
          test -s "$HNSW"

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "PIVOTS=$PIVOTS" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "HNSW=$HNSW" >> "$GITHUB_ENV"
          echo "GRAPHROOT=$GRAPHROOT" >> "$GITHUB_ENV"
          echo "SEEDROOT=$SEEDROOT" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$ART/geoivf-commit.txt"

          .venv/bin/python -m py_compile             scripts/extract_compact_pq_graph.py             scripts/generate_ram_pq_walk_seeds.py             scripts/qualify_ram_pq_walk_runtime.py             scripts/collect_navhints_heldout_traces.py             scripts/patch_diskann_navhints_trace.py

      - name: Distill compact PQ RAM graphs
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/extract_compact_pq_graph.py             --hnsw "$HNSW" --out-dir "$GRAPHROOT" --degrees "8,16,32"             2>&1 | tee "$ART/graph-extract.log"
          cp "$GRAPHROOT/manifest.json" "$ART/graph-manifest.json"
          test -s "$GRAPHROOT/pq-hnsw-level0-d16.bin"

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/rampq-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/rampq-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rampq-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/rampq-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build trace and custom-start DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-rampq
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-rampq
          git -C third_party/DiskANN-rampq checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_navhints_trace.py third_party/DiskANN-rampq
          (cd third_party/DiskANN-rampq && cargo fmt --all)
          git -C third_party/DiskANN-rampq diff --check
          (cd third_party/DiskANN-rampq && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-rampq/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Recover exact deployed NavHint starts
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/rampq-trace-$GITHUB_RUN_ID"
          TRACES="$ART/traces"
          rm -rf "$WORK" "$TRACES"
          mkdir -p "$WORK" "$TRACES"
          .venv/bin/python scripts/collect_navhints_heldout_traces.py             --binary "$RUNTIME_BIN" --queries "$QUERIES" --index-prefix "$INDEX"             --start-ivf "$IVF16" --work "$WORK" --out "$TRACES"             --start-row 9000 --rows 1000             2>&1 | tee "$ART/trace.log"
          rm -rf "$WORK"
          test -s "$TRACES/heldout.L40.jsonl"

      - name: Generate RAM-walk DiskANN seeds
        run: |
          set -euxo pipefail
          rm -rf "$SEEDROOT"; mkdir -p "$SEEDROOT"
          .venv/bin/python scripts/generate_ram_pq_walk_seeds.py             --queries "$QUERIES" --pq-pivots "$PIVOTS" --pq-codes "$CODES"             --graph "$GRAPHROOT/pq-hnsw-level0-d16.bin"             --trace "$ART/traces/heldout.L40.jsonl"             --out-dir "$SEEDROOT" --query-offset 9000 --query-count 1000             --budgets "16,32,64,128" --seed-counts "1,2,4"             2>&1 | tee "$ART/seed-generation.log"
          cp "$SEEDROOT/manifest.json" "$ART/seed-manifest.json"

      - name: Compare post-bootstrap SSD search
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/rampq-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_ram_pq_walk_runtime.py             --binary "$RUNTIME_BIN" --queries "$QUERIES" --gt5000 "$GT5000"             --index-prefix "$INDEX" --seed-dir "$SEEDROOT"             --manifest "$SEEDROOT/manifest.json" --work "$WORK" --out "$OUT" --reps 2             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ram-pq-walk-${{ github.run_id }}
          path: artifacts/ram-pq-walk/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/rampq-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/rampq-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/rampq-trace-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/rampq-eval-$GITHUB_RUN_ID"
