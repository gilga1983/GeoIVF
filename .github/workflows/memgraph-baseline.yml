name: Same-budget Starling MemGraph
on:
  push:
    branches: [experiment/memgraph-baseline]
    paths:
      - '.github/workflows/memgraph-baseline.yml'
      - 'scripts/collect_medoid_navigation_traces.py'
      - 'scripts/prepare_starling_memgraph_sample.py'
      - 'scripts/summarize_starling_memgraph.py'
      - 'scripts/qualify_memgraph_baseline.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-memgraph-baseline
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare frozen inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          mkdir -p artifacts/memgraph-baseline
          base="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          router="$HOME/.cache/geoivf/region-ablation-routers-v1/nlist-512/router.bin"
          waypoint="$HOME/.cache/geoivf/region-ablation-caches-v1/nlist-512/heavy-skip-b2500.bin"
          trace_cache="$HOME/.cache/geoivf/memgraph-medoid-trace-v1"
          mem_cache="$HOME/.cache/geoivf/starling-memgraph-3mib-v1"

          for f in "$base" "$queries" "$gt" "$router" "$waypoint"; do
            test -s "$f"
          done
          mkdir -p "$trace_cache" "$mem_cache"

          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "ROUTER=$router" >> "$GITHUB_ENV"
          echo "WAYPOINT=$waypoint" >> "$GITHUB_ENV"
          echo "TRACE_CACHE=$trace_cache" >> "$GITHUB_ENV"
          echo "MEM_CACHE=$mem_cache" >> "$GITHUB_ENV"

          git rev-parse HEAD > artifacts/memgraph-baseline/geoivf-commit.txt
          { uname -a; lscpu; free -h; df -h; ldconfig -p | grep -E 'mkl|iomp|tcmalloc|libaio' || true; } \
            > artifacts/memgraph-baseline/host.txt

          .venv/bin/python -m py_compile \
            scripts/collect_medoid_navigation_traces.py \
            scripts/prepare_starling_memgraph_sample.py \
            scripts/summarize_starling_memgraph.py \
            scripts/qualify_memgraph_baseline.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          CARGO_HOME="$RUNNER_TEMP/memgraph-cargo-$GITHUB_RUN_ID"
          RUSTUP_HOME="$RUNNER_TEMP/memgraph-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-$GITHUB_RUN_ID.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/rustup-$GITHUB_RUN_ID.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Compile medoid traversal recorder
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-memgraph-trace
          git -C third_party/DiskANN-memgraph-trace checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_waypoint_trace.py third_party/DiskANN-memgraph-trace
          (cd third_party/DiskANN-memgraph-trace && cargo fmt --all)
          git -C third_party/DiskANN-memgraph-trace diff --check
          (cd third_party/DiskANN-memgraph-trace && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/memgraph-baseline/trace-build.log
          echo "TRACE_BIN=$PWD/third_party/DiskANN-memgraph-trace/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Collect medoid training traversal frequency
        run: |
          set -euxo pipefail
          trace="$TRACE_CACHE/medoid-k1-train5000-trace.jsonl"
          if [ ! -s "$trace" ]; then
            rm -rf "$TRACE_CACHE"
            mkdir -p "$TRACE_CACHE"
            work="$RUNNER_TEMP/memgraph-trace-$GITHUB_RUN_ID"
            mkdir -p "$work"
            .venv/bin/python scripts/collect_medoid_navigation_traces.py \
              --binary "$TRACE_BIN" \
              --queries "$QUERIES" \
              --gt "$GT" \
              --index-prefix "$INDEX_PREFIX" \
              --work "$work" \
              --out "$TRACE_CACHE" \
              --train-rows 5000 \
              2>&1 | tee artifacts/memgraph-baseline/trace.log
            rm -rf "$work"
          fi
          test -s "$trace"
          cp "$TRACE_CACHE/trace-summary.json" artifacts/memgraph-baseline/trace-summary.json
          echo "TRAIN_TRACE=$trace" >> "$GITHUB_ENV"

      - name: Build official Starling tools
        run: |
          set -euxo pipefail
          starling_rev=17dc3e8a011533a62374445f53963e951b72883a
          git clone --recursive https://github.com/zilliztech/starling.git third_party/starling
          git -C third_party/starling checkout --detach "$starling_rev"
          git -C third_party/starling submodule update --init --recursive
          echo "$starling_rev" > artifacts/memgraph-baseline/starling-commit.txt

          cmake -S third_party/starling -B third_party/starling/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            2>&1 | tee artifacts/memgraph-baseline/starling-cmake.log
          cmake --build third_party/starling/build \
            --target build_memory_index search_memory_index -j4 \
            2>&1 | tee artifacts/memgraph-baseline/starling-build.log

          echo "STARLING_BUILD=$PWD/third_party/starling/build" >> "$GITHUB_ENV"

      - name: Prepare heldout query file
        run: |
          set -euxo pipefail
          held="$RUNNER_TEMP/memgraph-heldout-$GITHUB_RUN_ID.fbin"
          .venv/bin/python - "$QUERIES" "$held" <<'PY'
          import struct,sys
          from pathlib import Path
          src,dst=map(Path,sys.argv[1:])
          with src.open('rb') as f:
              rows,dim=struct.unpack('<II',f.read(8))
              assert (rows,dim)==(10000,768)
              f.seek(8+5000*dim*4)
              body=f.read(5000*dim*4)
              assert len(body)==5000*dim*4
          with dst.open('wb') as f:
              f.write(struct.pack('<II',5000,dim)); f.write(body)
          PY
          echo "HELDOUT=$held" >> "$GITHUB_ENV"

      - name: Build largest frequency and uniform MemGraphs under budget
        run: |
          set -euxo pipefail
          target=3159860
          builder="$STARLING_BUILD/tests/build_memory_index"
          test -x "$builder"

          for mode in frequency uniform; do
            root="$MEM_CACHE/$mode"
            mkdir -p "$root"
            chosen_file="$root/CHOSEN-v1.json"

            if [ -s "$chosen_file" ]; then
              count=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["count"])' "$chosen_file")
              idx=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["index_prefix"])' "$chosen_file")
              bytes=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["index_bytes"])' "$chosen_file")
              if [ ! -e "$idx" ] && ! compgen -G "$idx*" > /dev/null; then
                rm -f "$chosen_file"
              fi
            fi

            if [ ! -s "$chosen_file" ]; then
              chosen=""
              for count in 1024 1000 980 960 940 920 900 880 860 840 820 800; do
                sample="$root/sample-$count"
                idx="$root/index-$count"
                rm -f "$sample"_data.bin "$sample"_ids.bin "$sample".manifest.json "$idx"*

                args=(--base "$BASE" --out-prefix "$sample" --count "$count" --mode "$mode")
                if [ "$mode" = frequency ]; then
                  args+=(--trace "$TRAIN_TRACE")
                else
                  args+=(--seed 12345)
                fi
                .venv/bin/python scripts/prepare_starling_memgraph_sample.py "${args[@]}" \
                  2>&1 | tee "artifacts/memgraph-baseline/sample-$mode-$count.log"

                "$builder" \
                  --data_type float \
                  --dist_fn mips \
                  --data_path "$sample" \
                  --index_path_prefix "$idx" \
                  -R 48 -L 128 --alpha 1.2 -T 4 \
                  > "artifacts/memgraph-baseline/build-$mode-$count.log" 2>&1

                bytes=$(.venv/bin/python - "$idx" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); files=[x for x in p.parent.glob(p.name+'*') if x.is_file()]
          if not files: raise SystemExit('no Starling index files')
          print(sum(x.stat().st_size for x in files))
          PY
                )
                echo "$mode count=$count bytes=$bytes" | tee -a artifacts/memgraph-baseline/memory-sweep.log
                if [ "$bytes" -le "$target" ]; then
                  .venv/bin/python - "$chosen_file" "$count" "$idx" "$bytes" "$target" <<'PY'
          import json,sys
          path,count,idx,bs,target=sys.argv[1:]
          json.dump({"count":int(count),"index_prefix":idx,"index_bytes":int(bs),"target_bytes":int(target)},open(path,'w'),indent=2)
          PY
                  chosen=1
                  break
                fi
                rm -f "$idx"*
              done
              test -n "$chosen"
            fi

            count=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["count"])' "$chosen_file")
            idx=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["index_prefix"])' "$chosen_file")
            bytes=$(.venv/bin/python -c 'import json,sys; print(json.load(open(sys.argv[1]))["index_bytes"])' "$chosen_file")
            test "$bytes" -le "$target"
            compgen -G "$idx*" > /dev/null

            upper=$(echo "$mode" | tr '[:lower:]' '[:upper:]')
            echo "${upper}_MEM_COUNT=$count" >> "$GITHUB_ENV"
            echo "${upper}_MEM_INDEX=$idx" >> "$GITHUB_ENV"
            cp "$chosen_file" "artifacts/memgraph-baseline/chosen-$mode.json"
          done

      - name: Search official Starling MemGraphs
        run: |
          set -euxo pipefail
          search="$STARLING_BUILD/tests/search_memory_index"
          test -x "$search"
          mkdir -p artifacts/memgraph-baseline/starling-results

          for mode in frequency uniform; do
            upper=$(echo "$mode" | tr '[:lower:]' '[:upper:]')
            eval "idx=\$${upper}_MEM_INDEX"
            eval "count=\$${upper}_MEM_COUNT"
            result="$PWD/artifacts/memgraph-baseline/starling-results/$mode"
            log="$PWD/artifacts/memgraph-baseline/starling-$mode-search.log"

            "$search" \
              --data_type float \
              --dist_fn mips \
              --index_path_prefix "$idx" \
              --query_file "$HELDOUT" \
              --gt_file null \
              -K 1 \
              -L 1 4 8 16 32 64 \
              --result_path "$result" \
              -T 4 \
              --tags true \
              2>&1 | tee "$log"

            manifest="$PWD/artifacts/memgraph-baseline/starling-$mode-manifest.json"
            .venv/bin/python scripts/summarize_starling_memgraph.py \
              --mode "$mode" \
              --sample-count "$count" \
              --index-prefix "$idx" \
              --search-log "$log" \
              --result-prefix "$result" \
              --search-ls "1,4,8,16,32,64" \
              --target-bytes 3159860 \
              --out "$manifest"
          done

      - name: Compile custom-start DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-memgraph-start
          git -C third_party/DiskANN-memgraph-start checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_start_points.py third_party/DiskANN-memgraph-start
          (cd third_party/DiskANN-memgraph-start && cargo fmt --all)
          git -C third_party/DiskANN-memgraph-start diff --check
          (cd third_party/DiskANN-memgraph-start && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/memgraph-baseline/start-build.log
          echo "START_BIN=$PWD/third_party/DiskANN-memgraph-start/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Compile learned-waypoint DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-memgraph-waypoint
          git -C third_party/DiskANN-memgraph-waypoint checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_waypoint_cache.py third_party/DiskANN-memgraph-waypoint
          (cd third_party/DiskANN-memgraph-waypoint && cargo fmt --all)
          git -C third_party/DiskANN-memgraph-waypoint diff --check
          (cd third_party/DiskANN-memgraph-waypoint && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/memgraph-baseline/waypoint-build.log
          echo "WAYPOINT_BIN=$PWD/third_party/DiskANN-memgraph-waypoint/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Run heldout same-budget comparison
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/memgraph-compare-$GITHUB_RUN_ID"
          out="$PWD/artifacts/memgraph-baseline/results"
          mkdir -p "$work" "$out"

          .venv/bin/python scripts/qualify_memgraph_baseline.py \
            --start-binary "$START_BIN" \
            --waypoint-binary "$WAYPOINT_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --router "$ROUTER" \
            --waypoint "$WAYPOINT" \
            --memgraph-manifest "$PWD/artifacts/memgraph-baseline/starling-frequency-manifest.json" \
            --memgraph-manifest "$PWD/artifacts/memgraph-baseline/starling-uniform-manifest.json" \
            --work "$work" \
            --out "$out" \
            --train-rows 5000 \
            2>&1 | tee artifacts/memgraph-baseline/eval.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memgraph-baseline-${{ github.run_id }}
          path: artifacts/memgraph-baseline/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/memgraph-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/memgraph-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/memgraph-heldout-$GITHUB_RUN_ID.fbin"
