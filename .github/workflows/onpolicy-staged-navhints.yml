name: On-policy staged NavHints
# retry-after-trace-import-fix
on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/onpolicy-staged-navhints.yml'
      - 'scripts/run_onpolicy_staged_navhints_ci.sh'
      - 'scripts/collect_navhints_onpolicy_traces.py'
      - 'scripts/patch_diskann_navhints_trace.py'
      - 'scripts/qualify_onpolicy_staged_navhints.py'
      - 'scripts/learn_staged_navigation_landmarks.py'
      - 'scripts/patch_diskann_staged_navhints.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/learn_global_navigation_landmarks.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-performance
  cancel-in-progress: true

jobs:
  onpolicy:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run on-policy staged NavHints
        run: bash scripts/run_onpolicy_staged_navhints_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onpolicy-staged-navhints-${{ github.run_id }}
          path: artifacts/onpolicy-staged-navhints/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/onpolicy-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/onpolicy-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/onpolicy-trace-eval-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/onpolicy-staged-eval-$GITHUB_RUN_ID"
