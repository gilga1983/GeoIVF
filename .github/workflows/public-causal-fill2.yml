name: Frozen Fill2 public 10M suite

on:
  push:
    branches: [experiment/public-causal-fill2]
    paths:
      - '.github/workflows/public-causal-fill2.yml'
      - 'scripts/run_public_causal_fill2_ci.sh'
      - 'scripts/run_public_causal_one.sh'
      - 'scripts/qualify_public_causal_fill2.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_experience_core.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-public-causal-fill2
  cancel-in-progress: true

jobs:
  public-suite:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen causal controller on public 10M datasets
        run: bash scripts/run_public_causal_fill2_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-causal-fill2-${{ github.run_id }}
          path: artifacts/public-causal-fill2/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/public-causal-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/public-causal-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP"/public-causal-*-"$GITHUB_RUN_ID"
