name: Build PubMed IP portal router
on:
  push:
    branches: [experiment/catapult-ssd-paper]
    paths:
      - '.github/workflows/pubmed-ip-portal-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-pubmed-ip-portal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare environment
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "numpy>=1.25,<3" "faiss-cpu>=1.9,<2"
          mkdir -p artifacts/pubmed-ip-portal
          git rev-parse HEAD > artifacts/pubmed-ip-portal/geoivf-commit.txt
          { lscpu; free -h; df -h; } > artifacts/pubmed-ip-portal/host.txt

      - name: Build and validate 1M PubMed IP portal router
        run: |
          set -euxo pipefail
          base="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          test -s "$base"

          cache="$HOME/.cache/geoivf/pubmed1m-ip-portal-v1"
          mkdir -p "$cache"
          router="$cache/router.bin"

          if [ ! -s "$router" ] || [ ! -s "$router.manifest.json" ]; then
            rm -f "$router" "$router.manifest.json"
            .venv/bin/python scripts/prepare_pubmed_ip_portal_router.py \
              --base "$base" --out "$router" \
              --nlist 1024 --train-size 100000 --seed 12345 --threads 4 \
              2>&1 | tee artifacts/pubmed-ip-portal/build.log
          fi

          cp "$router.manifest.json" artifacts/pubmed-ip-portal/router.manifest.json
          sha256sum "$router" > artifacts/pubmed-ip-portal/router-sha256.txt
          cp "$router" artifacts/pubmed-ip-portal/router.bin

          .venv/bin/python - "$router.manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["metric"]=="inner_product"
          assert m["nlist"]==1024
          assert m["dimension"]==768
          assert m["rows"]==1000000
          assert m["cell_count_min"]>0
          print(json.dumps(m,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pubmed1m-ip-portal-${{ github.run_id }}
          path: artifacts/pubmed-ip-portal/
          retention-days: 30
