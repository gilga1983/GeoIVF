name: Native Starling NavHints compact budgets on MIPS workloads

# Separate from the successful Coveo/BigANN experiment.
# Following completed component ablations, compare compact budgets on PubMed/Text2Image-10M.
on:
  push:
    branches: [experiment/starling-prune-budget-20261012]
    paths:
      - ".github/workflows/starling-prune-mips.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-native-starling-prune-mips
  cancel-in-progress: false

jobs:
  native-source-check:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate float32 MIPS native source and causal query splits
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            scripts/patch_starling_prune_budget.py \
            scripts/generate_starling_prune_budget.py \
            scripts/summarize_starling_prune_budget.py
          for dataset in pubmed text2image; do
            python3 scripts/generate_starling_prune_budget.py "$dataset" --stage compact
            bash -n "scripts/run_starling_prune_budget_${dataset}_compact.generated.sh"
            grep -Fq 'DIST_FN=mips' \
              "scripts/run_starling_prune_budget_${dataset}_compact.generated.sh"
            grep -Fq 'DATA_TYPE=float' \
              "scripts/run_starling_prune_budget_${dataset}_compact.generated.sh"
          done
          echo STARLING_PRUNE_NATIVE_MIPS_SOURCE_CHECK_PASS

  native-mips:
    needs: native-source-check
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dataset: [pubmed, text2image]
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native MIPS Starling component ablations (same index and query stream)
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/generate_starling_prune_budget.py \
            "${{ matrix.dataset }}" --stage compact --run
      - name: Archive per-query native results and patch provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starling-prune-${{ matrix.dataset }}-compact-mips
          path: artifacts/starling-prune-budget-${{ matrix.dataset }}-compact/
          retention-days: 14
      - name: Remove isolated temporary original Starling native checkout
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/starling-prune-budget-${{ matrix.dataset }}-compact-$GITHUB_RUN_ID"
