name: Native online speed qualification
on:
  push:
    branches: [experiment/native-speed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-speed-qualification
  cancel-in-progress: false
jobs:
  speed:
    if: github.repository == 'gilga1983/GeoIVF' && (github.ref == 'refs/heads/experiment/native-speed' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native kernels, asynchronous reader, and regressions
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p artifacts/speed
          git rev-parse HEAD > artifacts/speed/commit.txt
          git archive --format=zip HEAD > artifacts/speed/source.zip
          .venv/bin/pip freeze > artifacts/speed/packages.txt
          { uname -a; lscpu; lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS; g++ --version; uptime; } > artifacts/speed/host.txt
          bash scripts/build_speed.sh 2>&1 | tee artifacts/speed/kernel-build.log
          bash scripts/setup_uring.sh 2>&1 | tee artifacts/speed/uring-build.log
          GEOIVF_TEST_DIRECT=1 GEOIVF_TEST_URING=1 .venv/bin/python -m pytest -q --junitxml=artifacts/speed/tests.xml
      - name: Validate shared canonical dataset
        run: .venv/bin/python scripts/fetch_sift1m.py --report artifacts/speed/dataset.json
      - name: Online plan equivalence and real asynchronous direct reads
        run: |
          .venv/bin/python scripts/qualify_speed.py \
            --work "$RUNNER_TEMP/geoivf-speed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out artifacts/speed/results --queries 64 --timed-queries 32 --repeats 5 --with-direct --depth 16 \
            2>&1 | tee artifacts/speed/qualification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-speed-${{ github.run_id }}
          path: artifacts/speed/
          retention-days: 30
      - name: Remove this run's temporary payload copies
        if: always()
        run: |
          work="$RUNNER_TEMP/geoivf-speed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$work" in "$RUNNER_TEMP"/geoivf-speed-*) rm -rf -- "$work" ;; *) exit 1 ;; esac
