name: Shared multistage NavHints
on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/shared-multistage-navhints.yml'
      - 'scripts/run_shared_multistage_navhints_ci.sh'
      - 'scripts/patch_diskann_shared_multistage_navhints.py'
      - 'scripts/qualify_shared_multistage_navhints.py'
      - 'scripts/learn_disjoint_multistage_landmarks.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-shared-multistage
  cancel-in-progress: true

jobs:
  shared:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run shared multistage NavHints
        shell: bash
        run: bash scripts/run_shared_multistage_navhints_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-multistage-navhints-${{ github.run_id }}
          path: artifacts/shared-multistage-navhints/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/sharedmulti-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sharedmulti-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sharedmulti-eval-$GITHUB_RUN_ID"
