name: NavHints vs official systems, shared BigANN-10M epoch
on:
  push:
    branches: [experiment/navhints-coepoch-10m]
    paths:
      - '.github/workflows/navhints-native-coepoch-bigann10m.yml'
      - 'scripts/run_navhints_native_coepoch_ci.sh'
      - 'scripts/measure_ann_process.py'
      - 'scripts/qualify_core_coepoch_once.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-navhints-coepoch-10m
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate scripts before acquiring SSD lock
        shell: bash
        run: |
          bash -n scripts/run_navhints_native_coepoch_ci.sh
          python3 -m py_compile scripts/measure_ann_process.py scripts/qualify_core_coepoch_once.py
          test -s "$HOME/.cache/geoivf/public-eval/bigann-10M/index/diskann-index.complete.json"
          df -h "$RUNNER_TEMP"
      - name: Build author-native layouts and measure Core in the same SSD epoch
        shell: bash
        run: bash scripts/run_navhints_native_coepoch_ci.sh
      - name: Save per-repeat matched-recall and external-resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navhints-official-coepoch
          path: artifacts/navhints-coepoch-bigann10m/
          retention-days: 30
      - name: Clean temporary 10M build state, keep user caches
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/navhints-coepoch-10m-$GITHUB_RUN_ID"
