name: Hub winners plus semantic cache

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/hub-cache-complementarity.yml'
      - 'scripts/qualify_hub_cache_complementarity.py'
      - 'scripts/patch_diskann_hub_winners.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-hub-cache-complementarity
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/hub-cache-complementarity"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          HUB_INDEX="$HOME/.cache/geoivf/hub-winners-v1/diskann-index"
          CACHE_ENTRIES="$HOME/.cache/geoivf/dedup-semantic-value-cache-v1/entries"

          mkdir -p "$ART"
          for f in "$QUERIES" "$GT5000" "$IVF16"                    "$HUB_INDEX"_disk.index "$HUB_INDEX"_pq_pivots.bin "$HUB_INDEX"_pq_compressed.bin                    "$CACHE_ENTRIES/manifest.json"                    "$CACHE_ENTRIES/skipdup-c512.bin" "$CACHE_ENTRIES/skipdup-c2048.bin"; do
            test -s "$f"
          done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "HUB_INDEX=$HUB_INDEX" >> "$GITHUB_ENV"
          echo "CACHE_ENTRIES=$CACHE_ENTRIES" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/qualify_hub_cache_complementarity.py             scripts/patch_diskann_vertex_navhints.py             scripts/patch_diskann_semantic_cache_page.py             scripts/patch_diskann_hub_winners.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/hubcache-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/hubcache-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/hubcache-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/hubcache-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build integrated evaluator
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-hub-cache
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-hub-cache
          git -C third_party/DiskANN-hub-cache checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-hub-cache --variants 8
          .venv/bin/python scripts/patch_diskann_semantic_cache_page.py third_party/DiskANN-hub-cache
          .venv/bin/python scripts/patch_diskann_hub_winners.py third_party/DiskANN-hub-cache
          (cd third_party/DiskANN-hub-cache && cargo fmt --all)
          git -C third_party/DiskANN-hub-cache diff --check
          (cd third_party/DiskANN-hub-cache && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/build.log"
          echo "EVAL_BIN=$PWD/third_party/DiskANN-hub-cache/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Evaluate complementarity
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/hubcache-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_hub_cache_complementarity.py             --binary "$EVAL_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$HUB_INDEX"             --ivf-16k "$IVF16"             --entry-dir "$CACHE_ENTRIES"             --cache-manifest "$CACHE_ENTRIES/manifest.json"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-cache-complementarity-${{ github.run_id }}
          path: artifacts/hub-cache-complementarity/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hubcache-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/hubcache-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/hubcache-eval-$GITHUB_RUN_ID"
