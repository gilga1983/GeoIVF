name: Semantic cache query-key comparison

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/semantic-cache-query-keys.yml'
      - 'scripts/compare_semantic_cache_query_keys.py'
      - 'scripts/qualify_semantic_cache_query_keys.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-semcache-query-keys
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/semantic-cache-query-keys"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          PIVOTS="$INDEX"_pq_pivots.bin
          CODES="$INDEX"_pq_compressed.bin
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          ROOT="$HOME/.cache/geoivf/semantic-cache-query-keys-v1"
          SEEDS="$ROOT/seeds"

          mkdir -p "$ART" "$SEEDS"
          for f in "$QUERIES" "$GT5000" "$INDEX"_disk.index "$PIVOTS" "$CODES" "$IVF16"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "PIVOTS=$PIVOTS" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "SEEDS=$SEEDS" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/compare_semantic_cache_query_keys.py             scripts/qualify_semantic_cache_query_keys.py             scripts/collect_navhints_heldout_traces.py             scripts/patch_diskann_navhints_trace.py             scripts/analyze_pq_semantic_filter.py

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/semkey-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/semkey-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/semkey-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/semkey-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build trace and custom-start DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-semkey
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-semkey
          git -C third_party/DiskANN-semkey checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_navhints_trace.py third_party/DiskANN-semkey
          (cd third_party/DiskANN-semkey && cargo fmt --all)
          git -C third_party/DiskANN-semkey diff --check
          (cd third_party/DiskANN-semkey && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-semkey/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Recover deployed NavHint starts
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/semkey-trace-$GITHUB_RUN_ID"
          TRACES="$ART/traces"
          rm -rf "$WORK" "$TRACES"; mkdir -p "$WORK" "$TRACES"
          .venv/bin/python scripts/collect_navhints_heldout_traces.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --index-prefix "$INDEX"             --start-ivf "$IVF16"             --work "$WORK"             --out "$TRACES"             --start-row 9000             --rows 1000             2>&1 | tee "$ART/trace.log"
          rm -rf "$WORK"
          test -s "$TRACES/heldout.L40.jsonl"

      - name: Build fp16 and PQ cache-key starts
        run: |
          set -euxo pipefail
          rm -rf "$SEEDS"; mkdir -p "$SEEDS"
          .venv/bin/python scripts/compare_semantic_cache_query_keys.py             --queries "$QUERIES"             --gt5000 "$GT5000"             --pq-pivots "$PIVOTS"             --pq-codes "$CODES"             --trace "$ART/traces/heldout.L40.jsonl"             --out-dir "$SEEDS"             --capacities "128,512,2048"             --result-count 10             2>&1 | tee "$ART/query-key-build.log"
          cp "$SEEDS/manifest.json" "$ART/query-key-manifest.json"

      - name: Compare downstream DiskANN
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/semkey-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_semantic_cache_query_keys.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$INDEX"             --seed-dir "$SEEDS"             --manifest "$SEEDS/manifest.json"             --work "$WORK"             --out "$OUT"             --reps 2             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-cache-query-keys-${{ github.run_id }}
          path: artifacts/semantic-cache-query-keys/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/semkey-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semkey-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semkey-trace-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/semkey-eval-$GITHUB_RUN_ID"
