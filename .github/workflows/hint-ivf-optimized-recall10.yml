name: Optimized NavHints Recall@10
on:
  push:
    branches: [experiment/hint-ivf-optimized]
    paths:
      - '.github/workflows/hint-ivf-optimized-recall10.yml'
      - 'scripts/run_hint_ivf_optimized_recall_curve_ci.sh'
      - 'scripts/qualify_hint_ivf_optimized_recall_curve.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/learn_global_navigation_landmarks.py'
      - 'scripts/perf_guard.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-performance
  cancel-in-progress: false

jobs:
  curve:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run optimized Recall@10 curve
        run: bash scripts/run_hint_ivf_optimized_recall_curve_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hint-ivf-optimized-recall10-${{ github.run_id }}
          path: artifacts/hint-ivf-optimized-recall10/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hintrecopt-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintrecopt-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintrecopt-eval-$GITHUB_RUN_ID"
