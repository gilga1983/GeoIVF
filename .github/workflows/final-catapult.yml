name: Equal-budget Catapult comparison

on:
  push:
    branches: [experiment/final-catapult-equal-budget]
    paths:
      - '.github/workflows/final-catapult.yml'
      - 'scripts/run_final_catapult_ci.sh'
      - 'scripts/qualify_final_catapult.py'
      - 'scripts/patch_diskann_experience_core.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_catapult_snapshot.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-final-catapult-equal-budget
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run final Catapult comparison
        run: bash scripts/run_final_catapult_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-catapult-${{ github.run_id }}
          path: artifacts/final-catapult/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/finalcat-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/finalcat-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/final-catapult-$GITHUB_RUN_ID"
