name: Deduplicated semantic value cache

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/dedup-semantic-value-cache.yml'
      - 'scripts/build_dedup_semantic_value_cache.py'
      - 'scripts/qualify_dedup_semantic_value_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-dedup-semantic-value-cache
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/dedup-semantic-value-cache"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          VERTEX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          ENTRIES="$HOME/.cache/geoivf/dedup-semantic-value-cache-v1/entries"

          mkdir -p "$ART" "$ENTRIES"
          for f in "$QUERIES" "$GT5000" "$ORIG"_disk.index "$ORIG"_pq_pivots.bin "$ORIG"_pq_compressed.bin "$IVF16" "$PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG=$ORIG" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"
          echo "VERTEX=$VERTEX" >> "$GITHUB_ENV"
          echo "ENTRIES=$ENTRIES" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/build_dedup_semantic_value_cache.py             scripts/qualify_dedup_semantic_value_cache.py             scripts/patch_diskann_semantic_cache_page.py             scripts/patch_diskann_result_ids_dump.py

      - name: Ensure enriched vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$VERTEX"_disk.index ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$PAYLOAD"               --output-disk-index "$VERTEX"_disk.index
          fi
          rm -f "$VERTEX"_pq_pivots.bin "$VERTEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$VERTEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$VERTEX"_pq_compressed.bin

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/dedupvalue-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/dedupvalue-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/dedupvalue-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/dedupvalue-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build comparison DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-dedup-value
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-dedup-value
          git -C third_party/DiskANN-dedup-value checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-dedup-value
          .venv/bin/python scripts/patch_diskann_semantic_cache_page.py third_party/DiskANN-dedup-value
          .venv/bin/python scripts/patch_diskann_result_ids_dump.py third_party/DiskANN-dedup-value
          (cd third_party/DiskANN-dedup-value && cargo fmt --all)
          git -C third_party/DiskANN-dedup-value diff --check
          (cd third_party/DiskANN-dedup-value && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-dedup-value/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Produce actual prior L160 results
        run: |
          set -euxo pipefail
          WARM="$ART/warm5000.fbin"
          .venv/bin/python - "$QUERIES" "$WARM" <<'PY'
          import struct,sys
          from pathlib import Path
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          with src.open("rb") as f:
              rows,dim=struct.unpack("<II",f.read(8))
              f.seek(8+5000*dim*4)
              data=f.read()
          with dst.open("wb") as g:
              g.write(struct.pack("<II",5000,dim)); g.write(data)
          PY

          .venv/bin/python - "$ART/producer.input.json" "$WARM" "$GT5000" "$VERTEX" <<'PY'
          import json,sys
          from pathlib import Path
          out,q,gt,prefix=map(Path,sys.argv[1:])
          cfg={"search_directories":[str(out.parent)],"jobs":[{"type":"disk-index","content":{
            "source":{"disk-index-source":"Load","data_type":"float32","load_path":str(prefix)},
            "search_phase":{"queries":str(q),"groundtruth":str(gt),"search_list":[160],
              "beam_width":8,"recall_at":10,"num_threads":4,"is_flat_search":False,
              "distance":"inner_product","vector_filters_file":None,"num_nodes_to_cache":None,
              "search_io_limit":None,"post_processor":None}}}]}
          out.write_text(json.dumps(cfg))
          PY

          export DISKANN_HINT_IVF_FILE="$IVF16"
          export DISKANN_HINT_IVF_NPROBE=8
          export DISKANN_HINT_IVF_MAX_STARTS=1
          export DISKANN_VERTEX_HINT_VARIANT=1
          export DISKANN_RESULT_IDS_FILE="$ART/producer.bin"
          "$RUNTIME_BIN" run             --input-file "$ART/producer.input.json"             --output-file "$ART/producer.output.json"             2>&1 | tee "$ART/producer.log"
          unset DISKANN_RESULT_IDS_FILE DISKANN_VERTEX_HINT_VARIANT DISKANN_HINT_IVF_FILE DISKANN_HINT_IVF_NPROBE DISKANN_HINT_IVF_MAX_STARTS
          test -s "$ART/producer.bin"

      - name: Build cache population policies
        run: |
          set -euxo pipefail
          rm -rf "$ENTRIES"; mkdir -p "$ENTRIES"
          .venv/bin/python scripts/build_dedup_semantic_value_cache.py             --queries "$QUERIES"             --pq-pivots "$ORIG"_pq_pivots.bin             --pq-codes "$ORIG"_pq_compressed.bin             --results "$ART/producer.bin"             --out-dir "$ENTRIES"             --capacities "512,2048"             2>&1 | tee "$ART/cache-build.log"
          cp "$ENTRIES/manifest.json" "$ART/cache-manifest.json"

      - name: Evaluate dedup policies
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/dedupvalue-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_dedup_semantic_value_cache.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$VERTEX"             --ivf-16k "$IVF16"             --entry-dir "$ENTRIES"             --manifest "$ENTRIES/manifest.json"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedup-semantic-value-cache-${{ github.run_id }}
          path: artifacts/dedup-semantic-value-cache/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/dedupvalue-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/dedupvalue-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/dedupvalue-eval-$GITHUB_RUN_ID"
