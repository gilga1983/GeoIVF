name: Navigation-trained DiskANN portals
on:
  push:
    branches: [experiment/navigation-portals]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-navigation-portals
  cancel-in-progress: false
jobs:
  navigation-portals:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Environment and regression tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p artifacts/navigation-portals
          git rev-parse HEAD > artifacts/navigation-portals/commit.txt
          git archive --format=zip HEAD > artifacts/navigation-portals/source.zip
          .venv/bin/pip freeze > artifacts/navigation-portals/packages.txt
          { uname -a; lscpu; lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS; df -h; uptime; } > artifacts/navigation-portals/host.txt
          .venv/bin/python -m py_compile scripts/patch_diskann_navigation_portals.py scripts/qualify_navigation_portals.py
          bash scripts/build_execution.sh --uring > artifacts/navigation-portals/geoivf-build.log 2>&1
          .venv/bin/python -m pytest -q --junitxml=artifacts/navigation-portals/tests.xml

      - name: Verify cached VIBE datasets
        run: |
          for ds in yahoo-minilm-384-normalized imagenet-clip-512-normalized coco-nomic-768-normalized; do
            .venv/bin/python scripts/fetch_ann_dataset.py "$ds" --report "artifacts/navigation-portals/$ds-dataset.json"
          done

      - name: Build pinned DiskANN3 with navigation portal audit
        run: |
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN3
          git -C third_party/DiskANN3 checkout --detach "$rev"
          test "$(git -C third_party/DiskANN3 rev-parse HEAD)" = "$rev"
          echo "$rev" > artifacts/navigation-portals/upstream-commit.txt

          export CARGO_HOME="$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh"
          sh "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          export RUSTFLAGS='-C target-cpu=native'

          .venv/bin/python scripts/patch_diskann_navigation_portals.py third_party/DiskANN3
          (cd third_party/DiskANN3 && cargo fmt --all)
          git -C third_party/DiskANN3 diff --check
          git -C third_party/DiskANN3 diff > artifacts/navigation-portals/upstream-navigation-portals.patch
          (cd third_party/DiskANN3 && cargo build --locked --release -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/navigation-portals/upstream-build.log

      - name: Run navigation-portal qualification
        run: |
          for ds in yahoo-minilm-384-normalized imagenet-clip-512-normalized coco-nomic-768-normalized; do
            echo "===== $ds ====="
            work="$RUNNER_TEMP/geoivf-navigation-portals-${GITHUB_RUN_ID}-$ds"
            out="artifacts/navigation-portals/$ds"
            .venv/bin/python scripts/qualify_navigation_portals.py "$ds" \
              --data "$HOME/.cache/geoivf/datasets/$ds.hdf5" \
              --binary "$PWD/third_party/DiskANN3/target/release/diskann-benchmark" \
              --work "$work" --out "$out" --repeats 3 \
              2>&1 | tee "artifacts/navigation-portals/$ds.log"
            case "$work" in "$RUNNER_TEMP"/geoivf-navigation-portals-*) rm -rf -- "$work" ;; *) exit 1 ;; esac
            df -h .
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-portals-${{ github.run_id }}
          path: artifacts/navigation-portals/
          retention-days: 30

      - name: Clean private toolchain scratch
        if: always()
        run: |
          for work in "$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}" "$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"; do
            case "$work" in "$RUNNER_TEMP"/geoivf-*) rm -rf -- "$work" ;; *) exit 1 ;; esac
          done
