name: BigANN BFS fifth matched-recall target
on:
  push:
    branches: [experiment/bigann-bfs-l640-20261013]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bigann-bfs-fifth-target-20261013
  cancel-in-progress: false

jobs:
  native-bfs-only:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Validate five-target script
        run: |
          python3 -m py_compile scripts/qualify_bigann_bfs_highrecall.py
          git diff --exit-code -- scripts/qualify_bigann_bfs_highrecall.py
      - name: Run only missing BigANN native BFS L640 measurement
        shell: bash
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          ROOT="$HOME/.cache/geoivf"
          PUBLIC="$ROOT/public-eval/bigann-10M"
          DATA="$PUBLIC/data"
          OUT="$GITHUB_WORKSPACE/artifacts/bigann-bfs-l640"
          WORK="$RUNNER_TEMP/bigann-bfs-tail-\${GITHUB_RUN_ID}"
          mkdir -p "$OUT" "$WORK"
          trap 'rm -rf "$WORK"' EXIT
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          export CARGO_HOME="$ROOT/catapult-fidelity-cargo"
          export RUSTUP_HOME="$ROOT/catapult-fidelity-rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          python3 - "$DATA/dataset.manifest.json" "$PUBLIC" "$WORK/manifest-paths" <<'PY'
          import json,sys
          from pathlib import Path
          j=json.loads(Path(sys.argv[1]).read_text())
          assert j["data_type"]=="uint8" and j["metric"]=="squared_l2", j
          for key in ("heldout5000", "heldout5000_gt"):
              p=Path(j["files"][key])
              assert p.is_file() and p.stat().st_size>0, (key,p)
              print(key,p)
          Path(sys.argv[3]).write_text(
              "\n".join(str(Path(j["files"][k])) for k in ("heldout5000","heldout5000_gt"))+"\n"
          )
          PY
          QUERIES="$(sed -n '1p' "$WORK/manifest-paths")"
          GT="$(sed -n '2p' "$WORK/manifest-paths")"
          INDEX="$PUBLIC/index/diskann-index"
          IVF="$PUBLIC/navhints/hints-b14464-nlist512.bin"
          test -s "$IVF"
          test -s "\${INDEX}_disk.index"
          sha256sum "$IVF" | tee "$OUT/ivf-sha256.txt"
          curl -fSL --retry 3 --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gilga1983/GeoIVF/actions/artifacts/11711862390/zip" \
            -o "$WORK/original-20261011.zip"
          unzip -p "$WORK/original-20261011.zip" results/section47-final-core.json > "$OUT/original-20261011.json"
          test -s "$OUT/original-20261011.json"
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git "$WORK/diskann-cache" > "$OUT/clone.log" 2>&1
          git -C "$WORK/diskann-cache" checkout --detach fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          python3 scripts/patch_diskann_hot_cache.py "$WORK/diskann-cache"
          rustup toolchain install 1.97.1 --profile minimal > "$OUT/rustup.log" 2>&1
          (cd "$WORK/diskann-cache"; git diff --check; cargo +1.97.1 build --release --locked -p diskann-benchmark --features disk-index) > "$OUT/build.log" 2>&1
          python3 scripts/qualify_bigann_bfs_highrecall.py \
            --binary "$WORK/diskann-cache/target/release/diskann-benchmark" \
            --index-prefix "$INDEX" \
            --queries "$QUERIES" --gt "$GT" --ivf "$IVF" \
            --original-json "$OUT/original-20261011.json" \
            --out "$OUT/results" | tee "$OUT/eval.log"
          test -s "$OUT/results/bigann-bfs-five-target-results.json"
          git rev-parse HEAD > "$OUT/geoivf-commit.txt"
          git diff --exit-code -- scripts/qualify_bigann_bfs_highrecall.py
      - name: Preserve all input contracts and output logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigann-native-bfs-L640-five-targets
          path: artifacts/bigann-bfs-l640/
          retention-days: 14
