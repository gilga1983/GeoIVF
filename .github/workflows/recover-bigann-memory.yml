name: Recover completed BigANN RAM measurements
on:
  push:
    branches: [experiment/navhints-bigann-memory]
    paths:
      - '.github/workflows/recover-bigann-memory.yml'
      - 'scripts/recover_bigann_memory_sweep.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  summarize-completed-repeats:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch prior successful measurements despite broken prior postprocessing
        uses: actions/download-artifact@v4
        with:
          name: navhints-bigann-memory
          run-id: 37983319473
          github-token: ${{ github.token }}
          path: prior-evidence
      - name: Verify all three repetitions and recompute five common recall anchors
        shell: bash
        run: |
          python3 -m py_compile scripts/recover_bigann_memory_sweep.py
          python3 scripts/recover_bigann_memory_sweep.py \
            --artifact prior-evidence/results/runs.partial.json \
            --output-dir artifacts/bigann-memory-recovered
      - name: Archive reproducible matched-recall tables and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: bigann-memory-three-repeat-recovered
          path: artifacts/bigann-memory-recovered/
          retention-days: 30
