name: Inspect official CatapultDB artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-catapult-official
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone official CatapultDB repository
        run: |
          set -euxo pipefail
          mkdir -p artifacts/catapult-official
          git clone --depth 1 https://gitlab.epfl.ch/randl/catapult.git third_party/catapult
          git -C third_party/catapult rev-parse HEAD | tee artifacts/catapult-official/commit.txt
          git -C third_party/catapult remote -v > artifacts/catapult-official/remotes.txt
          git -C third_party/catapult log -1 --date=iso-strict --pretty=fuller > artifacts/catapult-official/head.txt
          find third_party/catapult -maxdepth 3 -type f -not -path '*/.git/*' | sort > artifacts/catapult-official/tree.txt
          cp -f third_party/catapult/README* artifacts/catapult-official/ 2>/dev/null || true
          cp -f third_party/catapult/Cargo.toml artifacts/catapult-official/ 2>/dev/null || true
          cp -f third_party/catapult/Cargo.lock artifacts/catapult-official/ 2>/dev/null || true
          cp -f third_party/catapult/rust-toolchain.toml artifacts/catapult-official/ 2>/dev/null || true
          git -C third_party/catapult archive --format=zip HEAD > artifacts/catapult-official/source.zip

      - name: Install isolated Rust nightly
        run: |
          set -euxo pipefail
          CARGO_HOME="$RUNNER_TEMP/catapult-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/catapult-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/catapult-rustup-install-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME"             sh "$RUNNER_TEMP/catapult-rustup-install-${GITHUB_RUN_ID}.sh"               -y --profile minimal --no-modify-path --default-toolchain nightly
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build and test untouched official artifact
        run: |
          set -euxo pipefail
          {
            uname -a
            lscpu
            python3 --version || true
            cargo --version
            rustc --version
          } > artifacts/catapult-official/environment.txt
          (cd third_party/catapult && cargo metadata --no-deps --format-version 1)             > artifacts/catapult-official/cargo-metadata.json
          (cd third_party/catapult && cargo test --release --locked)             2>&1 | tee artifacts/catapult-official/cargo-test.log
          (cd third_party/catapult && cargo build --release --locked)             2>&1 | tee artifacts/catapult-official/cargo-build.log

      - name: Smoke-test released CatapultDB binary
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path

          root = Path("third_party/catapult/smoke16")
          root.mkdir(parents=True, exist_ok=True)
          points = [[0.0] * 16 for _ in range(4)]
          points[0][0] = 1.0
          points[1][0] = 2.0
          points[2][1] = 2.0
          points[3][1] = 1.0

          # Minimal NumPy v1.0 float32 C-order matrix, shape (4, 16).
          header = "{'descr': '<f4', 'fortran_order': False, 'shape': (4, 16), }"
          pre = 6 + 2 + 2
          pad = (16 - ((pre + len(header) + 1) % 16)) % 16
          header_bytes = (header + " " * pad + "\n").encode("latin1")
          with (root / "queries.npy").open("wb") as f:
              f.write(b"\x93NUMPY")
              f.write(bytes([1, 0]))
              f.write(struct.pack("<H", len(header_bytes)))
              f.write(header_bytes)
              for row in points:
                  for v in row:
                      f.write(struct.pack("<f", v))

          with (root / "payload.bin").open("wb") as f:
              f.write(struct.pack("<II", 4, 16))
              for row in points:
                  for v in row:
                      f.write(struct.pack("<f", v))

          neigh = ([1,3], [0,2], [1,3], [2,0])
          body = b"".join(
              struct.pack("<I", len(ns)) +
              b"".join(struct.pack("<I", n) for n in ns)
              for ns in neigh
          )
          with (root / "graph.bin").open("wb") as f:
              f.write(struct.pack("<QIIQ", 24 + len(body), 2, 0, 0))
              f.write(body)
          PY

          cd third_party/catapult
          ./target/release/catapult \
            --queries smoke16/queries.npy \
            --graph smoke16/graph.bin \
            --payload smoke16/payload.bin \
            --threads 1 --num-neighbors 1 --beam-width 2 \
            2>&1 | tee ../../artifacts/catapult-official/smoke-diskann.log
          ./target/release/catapult \
            --queries smoke16/queries.npy \
            --graph smoke16/graph.bin \
            --payload smoke16/payload.bin \
            --catapults \
            --threads 1 --num-neighbors 1 --beam-width 2 \
            2>&1 | tee ../../artifacts/catapult-official/smoke-catapult.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catapult-official-inspect-${{ github.run_id }}
          path: artifacts/catapult-official/
          retention-days: 30

      - name: Clean Rust scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/catapult-cargo-${GITHUB_RUN_ID}" "$RUNNER_TEMP/catapult-rustup-${GITHUB_RUN_ID}"
