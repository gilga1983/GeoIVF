name: Online PQ semantic cache

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/online-pq-semantic-cache.yml'
      - 'scripts/encode_query_pq_codes.py'
      - 'scripts/patch_diskann_online_pq_semantic_cache.py'
      - 'scripts/qualify_online_pq_semantic_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-online-pq-semantic-cache
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/online-pq-semantic-cache"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          VERTEX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          QCODES="$HOME/.cache/geoivf/online-pq-semantic-cache-v1/replay3000.qcpq"

          mkdir -p "$ART" "$(dirname "$QCODES")"
          for f in "$QUERIES" "$GT5000" "$ORIG"_disk.index "$ORIG"_pq_pivots.bin "$ORIG"_pq_compressed.bin "$IVF16" "$PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG=$ORIG" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"
          echo "VERTEX=$VERTEX" >> "$GITHUB_ENV"
          echo "QCODES=$QCODES" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/encode_query_pq_codes.py             scripts/patch_diskann_online_pq_semantic_cache.py             scripts/qualify_online_pq_semantic_cache.py

      - name: Ensure enriched vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$VERTEX"_disk.index ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$PAYLOAD"               --output-disk-index "$VERTEX"_disk.index               2>&1 | tee "$ART/embed.log"
          fi
          rm -f "$VERTEX"_pq_pivots.bin "$VERTEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$VERTEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$VERTEX"_pq_compressed.bin
          test -s "$VERTEX"_disk.index

      - name: Encode chronological query PQ keys
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/encode_query_pq_codes.py             --queries "$QUERIES"             --pq-pivots "$ORIG"_pq_pivots.bin             --pq-codes "$ORIG"_pq_compressed.bin             --start 7000             --rows 3000             --out "$QCODES"             2>&1 | tee "$ART/query-code.log"

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/onlinepq-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/onlinepq-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/onlinepq-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/onlinepq-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build online PQ-cache DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-online-pq-cache
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-online-pq-cache
          git -C third_party/DiskANN-online-pq-cache checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-online-pq-cache
          .venv/bin/python scripts/patch_diskann_online_pq_semantic_cache.py third_party/DiskANN-online-pq-cache
          (cd third_party/DiskANN-online-pq-cache && cargo fmt --all)
          git -C third_party/DiskANN-online-pq-cache diff --check
          (cd third_party/DiskANN-online-pq-cache && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-online-pq-cache/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Run online PQ-cache comparison
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/onlinepq-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_online_pq_semantic_cache.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$VERTEX"             --ivf-16k "$IVF16"             --query-codes "$QCODES"             --work "$WORK"             --out "$OUT"             --reps 3             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-pq-semantic-cache-${{ github.run_id }}
          path: artifacts/online-pq-semantic-cache/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/onlinepq-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/onlinepq-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/onlinepq-eval-$GITHUB_RUN_ID"
