name: NavHints BigANN-10M RAM sensitivity (1x-4x-16x)
on:
  push:
    branches: [experiment/navhints-bigann-memory]
    paths:
      - '.github/workflows/navhints-bigann-memory-sweep.yml'
      - 'scripts/run_bigann_memory_sweep_ci.sh'
      - 'scripts/qualify_bigann_memory_sweep.py'
      - 'scripts/prepare_qsev_bigann.py'
      - 'scripts/patch_diskann_qsev_l2.py'
      - 'scripts/qualify_public_causal_fill2.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-bigann-memory-sensitivity
  cancel-in-progress: false
jobs:
  bigann-memory:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate BigANN experiment before resource use
        shell: bash
        run: |
          bash -n scripts/run_bigann_memory_sweep_ci.sh
          python3 -m py_compile scripts/qualify_bigann_memory_sweep.py scripts/prepare_qsev_bigann.py scripts/patch_diskann_qsev_l2.py scripts/qualify_public_causal_fill2.py
          df -h "$RUNNER_TEMP"
      - name: Train L2 routing controls and measure matched-recall memory scaling
        shell: bash
        run: bash scripts/run_bigann_memory_sweep_ci.sh
      - name: Archive all source, calibrated RAM costs and three-repeat results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navhints-bigann-memory
          path: artifacts/bigann-memory-sweep/
          retention-days: 30
      - name: Delete only experiment-specific scratch
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/bigann-memory-sweep-$GITHUB_RUN_ID"
