name: Online semantic result cache

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/online-semantic-cache.yml'
      - 'scripts/patch_diskann_online_semantic_cache.py'
      - 'scripts/qualify_online_semantic_cache.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-online-semantic-cache
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/online-semantic-cache"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG_PREFIX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          ORIG_DISK="$ORIG_PREFIX"_disk.index
          ORIG_PIVOTS="$ORIG_PREFIX"_pq_pivots.bin
          ORIG_PQ="$ORIG_PREFIX"_pq_compressed.bin
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          VERTEX_PREFIX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          VERTEX_DISK="$VERTEX_PREFIX"_disk.index
          VERTEX_PIVOTS="$VERTEX_PREFIX"_pq_pivots.bin
          VERTEX_PQ="$VERTEX_PREFIX"_pq_compressed.bin

          mkdir -p "$ART"
          for f in "$QUERIES" "$GT5000" "$ORIG_DISK" "$ORIG_PIVOTS" "$ORIG_PQ" "$IVF16" "$PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG_DISK=$ORIG_DISK" >> "$GITHUB_ENV"
          echo "ORIG_PIVOTS=$ORIG_PIVOTS" >> "$GITHUB_ENV"
          echo "ORIG_PQ=$ORIG_PQ" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "PAYLOAD=$PAYLOAD" >> "$GITHUB_ENV"
          echo "VERTEX_PREFIX=$VERTEX_PREFIX" >> "$GITHUB_ENV"
          echo "VERTEX_DISK=$VERTEX_DISK" >> "$GITHUB_ENV"
          echo "VERTEX_PIVOTS=$VERTEX_PIVOTS" >> "$GITHUB_ENV"
          echo "VERTEX_PQ=$VERTEX_PQ" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/embed_vertex_navhints_in_diskann_index.py             scripts/patch_diskann_vertex_navhints.py             scripts/patch_diskann_online_semantic_cache.py             scripts/qualify_online_semantic_cache.py

      - name: Ensure enriched vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$VERTEX_DISK" ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG_DISK"               --payload "$PAYLOAD"               --output-disk-index "$VERTEX_DISK"               2>&1 | tee "$ART/embed.log"
          fi
          rm -f "$VERTEX_PIVOTS" "$VERTEX_PQ"
          ln -s "$ORIG_PIVOTS" "$VERTEX_PIVOTS"
          ln -s "$ORIG_PQ" "$VERTEX_PQ"
          test -s "$VERTEX_DISK"

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/sem-online-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/sem-online-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/sem-online-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/sem-online-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build online semantic-cache DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-semantic-online
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-semantic-online
          git -C third_party/DiskANN-semantic-online checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-semantic-online
          .venv/bin/python scripts/patch_diskann_online_semantic_cache.py third_party/DiskANN-semantic-online
          (cd third_party/DiskANN-semantic-online && cargo fmt --all)
          git -C third_party/DiskANN-semantic-online diff --check
          (cd third_party/DiskANN-semantic-online && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-semantic-online/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Run online cache comparison
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/sem-online-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_online_semantic_cache.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$VERTEX_PREFIX"             --ivf-16k "$IVF16"             --work "$WORK"             --out "$OUT"             --reps 3             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-semantic-cache-${{ github.run_id }}
          path: artifacts/online-semantic-cache/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/sem-online-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sem-online-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/sem-online-eval-$GITHUB_RUN_ID"
