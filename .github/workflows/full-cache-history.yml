name: NavHints full-cache history
on:
  push:
    branches: [experiment/full-cache-history]
    paths:
      - '.github/workflows/full-cache-history.yml'
      - 'scripts/run_full_cache_history_ci.sh'
      - 'scripts/learn_landmarks_trace_prefix.py'
      - 'scripts/qualify_full_cache_history.py'
      - 'scripts/collect_medoid_multil_traces.py'
      - 'scripts/patch_diskann_waypoint_trace.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/perf_guard.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-full-cache-history
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full-cache history experiment
        run: bash scripts/run_full_cache_history_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-cache-history-${{ github.run_id }}
          path: artifacts/full-cache-history/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/fullcache-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/fullcache-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/fullcache-trace-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/fullcache-eval-$GITHUB_RUN_ID"
