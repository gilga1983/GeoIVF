name: Embedded NavHints runtime

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/embedded-navhints-runtime.yml'
      - 'scripts/embed_navhints_in_diskann_index.py'
      - 'scripts/patch_diskann_embedded_navhints.py'
      - 'scripts/learn_equal_region_navhints.py'
      - 'scripts/learn_equal_region_navhints_sweep.py'
      - 'scripts/qualify_embedded_navhints_runtime.py'
      - 'scripts/qualify_regional_navhints_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-embedded-navhints-runtime
  cancel-in-progress: true

jobs:
  embedded:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/embedded-navhints-runtime"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG_PREFIX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          TRACE="$HOME/.cache/geoivf/regional-navhints-runtime-v1/onpolicy-trace/navhints16k-teacher-L64.jsonl"
          ROUTER="$HOME/.cache/geoivf/region-ablation-routers-v1/nlist-256/router.bin"
          ROOT="$HOME/.cache/geoivf/embedded-navhints-v1"
          MAPROOT="$ROOT/map"
          EMBED_PREFIX="$ROOT/diskann-index"

          mkdir -p "$ART" "$MAPROOT" "$ROOT"
          ORIG_DISK="$ORIG_PREFIX"_disk.index
          ORIG_PIVOTS="$ORIG_PREFIX"_pq_pivots.bin
          ORIG_PQ="$ORIG_PREFIX"_pq_compressed.bin
          EMBED_DISK="$EMBED_PREFIX"_disk.index
          EMBED_PIVOTS="$EMBED_PREFIX"_pq_pivots.bin
          EMBED_PQ="$EMBED_PREFIX"_pq_compressed.bin

          for f in "$BASE" "$QUERIES" "$GT5000" "$ORIG_DISK" "$ORIG_PIVOTS" "$ORIG_PQ" "$IVF16" "$TRACE" "$ROUTER"; do
            test -s "$f"
          done
          test "$(wc -l < "$TRACE")" -eq 9000

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG_PREFIX=$ORIG_PREFIX" >> "$GITHUB_ENV"
          echo "ORIG_DISK=$ORIG_DISK" >> "$GITHUB_ENV"
          echo "ORIG_PIVOTS=$ORIG_PIVOTS" >> "$GITHUB_ENV"
          echo "ORIG_PQ=$ORIG_PQ" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"
          echo "ROUTER=$ROUTER" >> "$GITHUB_ENV"
          echo "MAPROOT=$MAPROOT" >> "$GITHUB_ENV"
          echo "EMBED_PREFIX=$EMBED_PREFIX" >> "$GITHUB_ENV"
          echo "EMBED_DISK=$EMBED_DISK" >> "$GITHUB_ENV"
          echo "EMBED_PIVOTS=$EMBED_PIVOTS" >> "$GITHUB_ENV"
          echo "EMBED_PQ=$EMBED_PQ" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          { df -h; free -h; } > "$ART/host-before.txt"
          .venv/bin/python -m py_compile \
            scripts/embed_navhints_in_diskann_index.py \
            scripts/patch_diskann_embedded_navhints.py \
            scripts/learn_equal_region_navhints.py \
            scripts/learn_equal_region_navhints_sweep.py \
            scripts/qualify_embedded_navhints_runtime.py \
            scripts/qualify_regional_navhints_runtime.py

      - name: Learn 256-region continuation maps
        run: |
          set -euxo pipefail
          rm -rf "$MAPROOT"
          mkdir -p "$MAPROOT"
          .venv/bin/python scripts/learn_equal_region_navhints_sweep.py \
            --base "$BASE" \
            --router "$ROUTER" \
            --trace "$TRACE" \
            --out-dir "$MAPROOT" \
            --per-regions "8" \
            --min-entry-pos 8 \
            --threads 4 \
            2>&1 | tee "$ART/learn.log"
          test -s "$MAPROOT/regional-256x8.bin"
          cp "$MAPROOT/regional-256x8.bin.manifest.json" "$ART/map.manifest.json"

      - name: Repack DiskANN graph with embedded hints
        run: |
          set -euxo pipefail
          rm -f "$EMBED_DISK" "$EMBED_DISK.manifest.json"
          .venv/bin/python scripts/embed_navhints_in_diskann_index.py \
            --input-disk-index "$ORIG_DISK" \
            --regional "$MAPROOT/regional-256x8.bin" \
            --output-disk-index "$EMBED_DISK" \
            2>&1 | tee "$ART/embed.log"
          test -s "$EMBED_DISK"
          cp "$EMBED_DISK.manifest.json" "$ART/embed.manifest.json"

          rm -f "$EMBED_PIVOTS" "$EMBED_PQ"
          ln -s "$ORIG_PIVOTS" "$EMBED_PIVOTS"
          ln -s "$ORIG_PQ" "$EMBED_PQ"
          test -s "$EMBED_PIVOTS"
          test -s "$EMBED_PQ"

          .venv/bin/python - "$ART/embed.manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["associated_data_bytes"] == 32
          assert m["embedded_hint_slots"] == 8
          assert m["physical_file_size_change"] == 0
          assert m["old_sectors_per_node"] == m["new_sectors_per_node"]
          assert m["old_nodes_per_block"] == m["new_nodes_per_block"]
          print(json.dumps(m,indent=2))
          PY

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/embedded-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/embedded-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/embedded-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/embedded-rustup-$GITHUB_RUN_ID.sh" \
            -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build embedded-hint DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-embedded
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-embedded
          git -C third_party/DiskANN-embedded checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_embedded_navhints.py third_party/DiskANN-embedded
          (cd third_party/DiskANN-embedded && cargo fmt --all)
          git -C third_party/DiskANN-embedded diff --check
          git -C third_party/DiskANN-embedded diff > "$ART/embedded-runtime.patch"
          (cd third_party/DiskANN-embedded && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-embedded/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Run embedded 0-4-8 speed and recall comparison
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/embedded-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_embedded_navhints_runtime.py \
            --binary "$RUNTIME_BIN" \
            --queries "$QUERIES" \
            --gt5000 "$GT5000" \
            --index-prefix "$EMBED_PREFIX" \
            --ivf-16k "$IVF16" \
            --embed-manifest "$ART/embed.manifest.json" \
            --work "$WORK" \
            --out "$OUT" \
            --reps 5 \
            2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"
          { df -h; free -h; } > "$ART/host-after.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-navhints-runtime-${{ github.run_id }}
          path: artifacts/embedded-navhints-runtime/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/embedded-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/embedded-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/embedded-eval-$GITHUB_RUN_ID"
