name: Integrated RAM PQ walk

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/integrated-ram-pq-walk.yml'
      - 'scripts/patch_diskann_ram_pq_walk.py'
      - 'scripts/qualify_integrated_ram_pq_walk.py'
      - 'scripts/extract_compact_pq_graph.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-integrated-ram-pq-walk
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/integrated-ram-pq-walk"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          INDEX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          HNSW="$HOME/.cache/geoivf/pq-reconstruction-ann-v1/pubmed1m-pq-reconstruction-hnsw-M16.index"
          GRAPHROOT="$HOME/.cache/geoivf/ram-pq-walk-v1/graphs"

          mkdir -p "$ART" "$GRAPHROOT"
          for f in "$QUERIES" "$GT5000" "$IVF16" "$HNSW"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "INDEX=$INDEX" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "HNSW=$HNSW" >> "$GITHUB_ENV"
          echo "GRAPHROOT=$GRAPHROOT" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile             scripts/extract_compact_pq_graph.py             scripts/patch_diskann_hint_ivf_packed_direct.py             scripts/patch_diskann_ram_pq_walk.py             scripts/qualify_integrated_ram_pq_walk.py

      - name: Distill graph memory points
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/extract_compact_pq_graph.py             --hnsw "$HNSW" --out-dir "$GRAPHROOT" --degrees "4,8,16"             2>&1 | tee "$ART/graph-extract.log"
          cp "$GRAPHROOT/manifest.json" "$ART/graph-manifest.json"
          for d in 4 8 16; do test -s "$GRAPHROOT/pq-hnsw-level0-d$d.bin"; done

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/intram-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/intram-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/intram-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/intram-rustup-$GITHUB_RUN_ID.sh"             -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build integrated DiskANN
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-integrated-ram
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-integrated-ram
          git -C third_party/DiskANN-integrated-ram checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_hint_ivf_packed_direct.py third_party/DiskANN-integrated-ram
          .venv/bin/python scripts/patch_diskann_ram_pq_walk.py third_party/DiskANN-integrated-ram
          (cd third_party/DiskANN-integrated-ram && cargo fmt --all)
          git -C third_party/DiskANN-integrated-ram diff --check
          (cd third_party/DiskANN-integrated-ram &&             cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/runtime-build.log"
          echo "RUNTIME_BIN=$PWD/third_party/DiskANN-integrated-ram/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Measure benefit per MB
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/intram-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_integrated_ram_pq_walk.py             --binary "$RUNTIME_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$INDEX"             --ivf-16k "$IVF16"             --graph-root "$GRAPHROOT"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-ram-pq-walk-${{ github.run_id }}
          path: artifacts/integrated-ram-pq-walk/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/intram-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/intram-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/intram-eval-$GITHUB_RUN_ID"
