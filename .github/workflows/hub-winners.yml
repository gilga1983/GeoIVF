name: 16K hub independent winners

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/hub-winners.yml'
      - 'scripts/collect_navhint_hubs.py'
      - 'scripts/build_hub_winner_payload.py'
      - 'scripts/patch_diskann_hub_winners.py'
      - 'scripts/qualify_hub_winners.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-hub-winners
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/hub-winners"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          BASE_PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          BASE_VERTEX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          ROOT="$HOME/.cache/geoivf/hub-winners-v1"
          HUB_PAYLOAD="$ROOT/vertex-plus-hub-winners.bin"
          HUB_INDEX="$ROOT/diskann-index"

          mkdir -p "$ART" "$ROOT"
          for f in "$QUERIES" "$GT5000" "$ORIG"_disk.index "$ORIG"_pq_pivots.bin "$ORIG"_pq_compressed.bin "$IVF16" "$BASE_PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG=$ORIG" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "BASE_PAYLOAD=$BASE_PAYLOAD" >> "$GITHUB_ENV"
          echo "BASE_VERTEX=$BASE_VERTEX" >> "$GITHUB_ENV"
          echo "HUB_PAYLOAD=$HUB_PAYLOAD" >> "$GITHUB_ENV"
          echo "HUB_INDEX=$HUB_INDEX" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/collect_navhint_hubs.py             scripts/build_hub_winner_payload.py             scripts/patch_diskann_hub_winners.py             scripts/qualify_hub_winners.py             scripts/embed_vertex_navhints_in_diskann_index.py             scripts/patch_diskann_result_ids_dump.py

      - name: Ensure baseline vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$BASE_VERTEX"_disk.index ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$BASE_PAYLOAD"               --output-disk-index "$BASE_VERTEX"_disk.index
          fi
          rm -f "$BASE_VERTEX"_pq_pivots.bin "$BASE_VERTEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$BASE_VERTEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$BASE_VERTEX"_pq_compressed.bin

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/hubwinner-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/hubwinner-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/hubwinner-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/hubwinner-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build start-only hub tracer
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-hub-trace
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-hub-trace
          git -C third_party/DiskANN-hub-trace checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_navhints_trace.py third_party/DiskANN-hub-trace
          (cd third_party/DiskANN-hub-trace && cargo fmt --all)
          git -C third_party/DiskANN-hub-trace diff --check
          (cd third_party/DiskANN-hub-trace && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/trace-build.log"
          echo "TRACE_BIN=$PWD/third_party/DiskANN-hub-trace/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Collect deployed warm hubs
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/hubtrace-$GITHUB_RUN_ID"
          OUT="$ART/hub-trace"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/collect_navhint_hubs.py             --binary "$TRACE_BIN"             --queries "$QUERIES"             --index-prefix "$ORIG"             --start-ivf "$IVF16"             --work "$WORK"             --out "$OUT"             --start-row 5000             --rows 4000             2>&1 | tee "$ART/hub-trace.log"
          rm -rf "$WORK"
          test -s "$OUT/hubs.jsonl"

      - name: Build five-variant L160 producer
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-hub-producer
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-hub-producer
          git -C third_party/DiskANN-hub-producer checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-hub-producer --variants 5
          .venv/bin/python scripts/patch_diskann_result_ids_dump.py third_party/DiskANN-hub-producer
          (cd third_party/DiskANN-hub-producer && cargo fmt --all)
          git -C third_party/DiskANN-hub-producer diff --check
          (cd third_party/DiskANN-hub-producer && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/producer-build.log"
          echo "PRODUCER_BIN=$PWD/third_party/DiskANN-hub-producer/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Produce actual warm L160 winners
        run: |
          set -euxo pipefail
          Q="$ART/warm4000.fbin"
          GT="$ART/warm4000.gt"
          .venv/bin/python - "$QUERIES" "$GT5000" "$Q" "$GT" <<'PY'
          import struct,sys
          from pathlib import Path
          qsrc,gsrc,qdst,gdst=map(Path,sys.argv[1:])
          with qsrc.open("rb") as f:
              rows,dim=struct.unpack("<II",f.read(8)); assert rows==10000
              f.seek(8+5000*dim*4); data=f.read(4000*dim*4)
          with qdst.open("wb") as f:
              f.write(struct.pack("<II",4000,dim));f.write(data)
          raw=gsrc.read_bytes();gr,gk=struct.unpack("<II",raw[:8]);assert gr==5000
          with gdst.open("wb") as f:
              f.write(struct.pack("<II",4000,gk));f.write(raw[8:8+4000*gk*4])
          PY
          .venv/bin/python - "$ART/producer.input.json" "$Q" "$GT" "$BASE_VERTEX" <<'PY'
          import json,sys
          from pathlib import Path
          out,q,gt,prefix=map(Path,sys.argv[1:])
          cfg={"search_directories":[str(out.parent)],"jobs":[{"type":"disk-index","content":{
            "source":{"disk-index-source":"Load","data_type":"float32","load_path":str(prefix)},
            "search_phase":{"queries":str(q),"groundtruth":str(gt),"search_list":[160],
              "beam_width":8,"recall_at":10,"num_threads":4,"is_flat_search":False,
              "distance":"inner_product","vector_filters_file":None,"num_nodes_to_cache":None,
              "search_io_limit":None,"post_processor":None}}}]}
          out.write_text(json.dumps(cfg))
          PY
          export DISKANN_HINT_IVF_FILE="$IVF16"
          export DISKANN_HINT_IVF_NPROBE=8
          export DISKANN_HINT_IVF_MAX_STARTS=1
          export DISKANN_VERTEX_HINT_VARIANT=1
          export DISKANN_RESULT_IDS_FILE="$ART/producer.bin"
          exec 9>"$HOME/.cache/geoivf/speed-device.lock"
          flock 9
          "$PRODUCER_BIN" run             --input-file "$ART/producer.input.json"             --output-file "$ART/producer.output.json"             2>&1 | tee "$ART/producer.log"
          test -s "$ART/producer.bin"

      - name: Learn winners at 16K hubs
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/build_hub_winner_payload.py             --base-payload "$BASE_PAYLOAD"             --trace "$ART/hub-trace/hubs.jsonl"             --results "$ART/producer.bin"             --output "$HUB_PAYLOAD"             --warm-rows 4000             2>&1 | tee "$ART/hub-winner-payload.log"
          cp "$HUB_PAYLOAD.manifest.json" "$ART/hub-winner-payload-manifest.json"

      - name: Embed hub-winner index
        run: |
          set -euxo pipefail
          rm -f "$HUB_INDEX"_disk.index "$HUB_INDEX"_disk.index.manifest.json
          .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py             --input-disk-index "$ORIG"_disk.index             --payload "$HUB_PAYLOAD"             --output-disk-index "$HUB_INDEX"_disk.index             2>&1 | tee "$ART/hub-index.log"
          rm -f "$HUB_INDEX"_pq_pivots.bin "$HUB_INDEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$HUB_INDEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$HUB_INDEX"_pq_compressed.bin
          cp "$HUB_INDEX"_disk.index.manifest.json "$ART/hub-index-manifest.json"

      - name: Build eight-variant evaluator
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-hub-eval
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-hub-eval
          git -C third_party/DiskANN-hub-eval checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-hub-eval --variants 8
          .venv/bin/python scripts/patch_diskann_hub_winners.py third_party/DiskANN-hub-eval
          (cd third_party/DiskANN-hub-eval && cargo fmt --all)
          git -C third_party/DiskANN-hub-eval diff --check
          (cd third_party/DiskANN-hub-eval && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/evaluator-build.log"
          echo "EVAL_BIN=$PWD/third_party/DiskANN-hub-eval/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Evaluate hub winner counts
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/hubwinner-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_hub_winners.py             --binary "$EVAL_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$HUB_INDEX"             --ivf-16k "$IVF16"             --payload-manifest "$HUB_PAYLOAD.manifest.json"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-winners-${{ github.run_id }}
          path: artifacts/hub-winners/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hubwinner-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/hubwinner-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/hubtrace-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/hubwinner-eval-$GITHUB_RUN_ID"
