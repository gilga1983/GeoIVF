name: IVF-PQ seeded DiskANN navigation
on:
  push:
    branches: [experiment/diskann-seeded]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-speed-qualification
  cancel-in-progress: false
jobs:
  seeded:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Environment, Python tests and canonical SIFT1M
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          mkdir -p artifacts/diskann-seeds
          git rev-parse HEAD > artifacts/diskann-seeds/commit.txt
          git archive --format=zip HEAD > artifacts/diskann-seeds/source.zip
          .venv/bin/pip freeze > artifacts/diskann-seeds/packages.txt
          { uname -a; lscpu; lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS; uptime; } > artifacts/diskann-seeds/host.txt
          .venv/bin/python -m py_compile scripts/patch_diskann_start_points.py scripts/qualify_diskann_seeds.py
          bash scripts/build_execution.sh --uring > artifacts/diskann-seeds/geoivf-build.log 2>&1
          .venv/bin/python -m pytest -q --junitxml=artifacts/diskann-seeds/tests.xml
          .venv/bin/python scripts/fetch_sift1m.py --report artifacts/diskann-seeds/dataset.json

      - name: Build pinned DiskANN3 with start-point-only carrier patch
        run: |
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN3
          git -C third_party/DiskANN3 checkout --detach "$rev"
          test "$(git -C third_party/DiskANN3 rev-parse HEAD)" = "$rev"
          echo "$rev" > artifacts/diskann-seeds/upstream-commit.txt
          .venv/bin/python scripts/patch_diskann_start_points.py third_party/DiskANN3
          (cd third_party/DiskANN3 && cargo fmt --all)
          git -C third_party/DiskANN3 diff --check
          git -C third_party/DiskANN3 diff > artifacts/diskann-seeds/upstream-start-points.patch

          export CARGO_HOME="$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh"
          sh "$RUNNER_TEMP/geoivf-rustup-install-${GITHUB_RUN_ID}.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export PATH="$CARGO_HOME/bin:$PATH"
          export RUSTFLAGS='-C target-cpu=native'
          (cd third_party/DiskANN3 && cargo build --locked --release -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/diskann-seeds/upstream-build.log

      - name: Tune only seed policy then evaluate fresh held-out cohort
        run: |
          .venv/bin/python scripts/qualify_diskann_seeds.py \
            --binary "$PWD/third_party/DiskANN3/target/release/diskann-benchmark" \
            --work "$RUNNER_TEMP/geoivf-diskann-seeds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --out artifacts/diskann-seeds/results --development 128 --heldout 256 --repeats 3 \
            2>&1 | tee artifacts/diskann-seeds/qualification.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diskann-seeds-${{ github.run_id }}
          path: artifacts/diskann-seeds/
          retention-days: 30

      - name: Remove only this run's private temporary files
        if: always()
        run: |
          for work in \
            "$RUNNER_TEMP/geoivf-diskann-seeds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/geoivf-cargo-${GITHUB_RUN_ID}" \
            "$RUNNER_TEMP/geoivf-rustup-${GITHUB_RUN_ID}"; do
            case "$work" in "$RUNNER_TEMP"/geoivf-*) rm -rf -- "$work" ;; *) exit 1 ;; esac
          done
