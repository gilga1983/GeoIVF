name: Final NavHints shift test

on:
  push:
    branches: [experiment/final-shift]
    paths:
      - '.github/workflows/final-shift.yml'
      - 'scripts/run_final_shift_ci.sh'
      - 'scripts/qualify_final_shift.py'
      - 'scripts/patch_diskann_experience_core.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-final-shift
  cancel-in-progress: true

jobs:
  shift:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run final shift test
        shell: bash
        run: bash scripts/run_final_shift_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-shift-${{ github.run_id }}
          path: artifacts/final-shift/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/finalshift-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/finalshift-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/final-shift-$GITHUB_RUN_ID"
