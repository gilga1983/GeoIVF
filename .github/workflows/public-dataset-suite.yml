name: NavHints public dataset suite
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-public-dataset-suite
  cancel-in-progress: true

jobs:
  public-suite:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run public dataset suite
        run: bash scripts/run_public_dataset_suite_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-eval-${{ github.run_id }}
          path: artifacts/public-eval/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/public-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/public-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/public-text2image-10M-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/public-bigann-10M-$GITHUB_RUN_ID"
