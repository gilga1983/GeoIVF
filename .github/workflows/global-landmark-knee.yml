name: Global navigation landmark knee
on:
  push:
    branches: [experiment/id-portal-sweep]
    paths:
      - '.github/workflows/global-landmark-knee.yml'
      - 'scripts/learn_global_navigation_landmarks.py'
      - 'scripts/qualify_global_landmark_knee.py'
      - 'scripts/run_global_landmark_knee_ci.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-global-landmark-knee
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run global landmark knee
        run: bash scripts/run_global_landmark_knee_ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-landmark-knee-${{ github.run_id }}
          path: artifacts/global-landmark-knee/
          retention-days: 30
