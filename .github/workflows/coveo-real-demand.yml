name: Coveo real-demand paper evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-coveo-real-demand
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real Coveo demand evaluation
        run: bash scripts/run_coveo_real_demand_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coveo-real-demand-${{ github.run_id }}
          path: artifacts/coveo-real-demand/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/coveo-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/coveo-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/coveo-real-demand-$GITHUB_RUN_ID"
