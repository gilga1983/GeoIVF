name: Long region-conditioned navigation

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/long-region-conditioned-navigation.yml'
      - 'scripts/analyze_region_conditioned_navigation.py'
      - 'scripts/collect_medoid_multil_traces.py'
      - 'scripts/patch_diskann_waypoint_trace.py'
      - 'scripts/prepare_pubmed_ip_portal_router.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-long-region-conditioned-navigation
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/long-region-conditioned-navigation"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT="$HOME/.cache/geoivf/catapult-paper-pubmed1m/throughput-only.gt"
          INDEX_PREFIX="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          TRACE_ROOT="$HOME/.cache/geoivf/high-l-medoid-teacher-traces-10k-v1"
          ROUTER_ROOT="$HOME/.cache/geoivf/region-ablation-routers-v1"

          mkdir -p "$ART" "$TRACE_ROOT" "$ROUTER_ROOT"
          for f in "$BASE" "$QUERIES" "$GT"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT=$GT" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$INDEX_PREFIX" >> "$GITHUB_ENV"
          echo "TRACE_ROOT=$TRACE_ROOT" >> "$GITHUB_ENV"
          echo "ROUTER_ROOT=$ROUTER_ROOT" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile \
            scripts/analyze_region_conditioned_navigation.py \
            scripts/collect_medoid_multil_traces.py \
            scripts/patch_diskann_waypoint_trace.py \
            scripts/prepare_pubmed_ip_portal_router.py

      - name: Collect full 10K L64 traversal trace
        run: |
          set -euxo pipefail
          TRACE="$TRACE_ROOT/medoid-teacher.L64.jsonl"
          if [ ! -s "$TRACE" ]; then
            rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
            rm -rf third_party/DiskANN-region-long-trace
            git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-region-long-trace
            git -C third_party/DiskANN-region-long-trace checkout --detach "$rev"

            export CARGO_HOME="$RUNNER_TEMP/region-long-cargo-$GITHUB_RUN_ID"
            export RUSTUP_HOME="$RUNNER_TEMP/region-long-rustup-$GITHUB_RUN_ID"
            mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
            curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/region-long-rustup-$GITHUB_RUN_ID.sh"
            sh "$RUNNER_TEMP/region-long-rustup-$GITHUB_RUN_ID.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
            export PATH="$CARGO_HOME/bin:$PATH"
            rustup component add rustfmt

            .venv/bin/python scripts/patch_diskann_waypoint_trace.py third_party/DiskANN-region-long-trace
            (cd third_party/DiskANN-region-long-trace && cargo fmt --all)
            git -C third_party/DiskANN-region-long-trace diff --check
            (cd third_party/DiskANN-region-long-trace && \
              cargo build --release --locked -p diskann-benchmark --features disk-index) \
              2>&1 | tee "$ART/trace-build.log"

            TRACE_BIN="$PWD/third_party/DiskANN-region-long-trace/target/release/diskann-benchmark"
            WORK="$RUNNER_TEMP/region-long-trace-$GITHUB_RUN_ID"
            rm -rf "$WORK" "$TRACE_ROOT"
            mkdir -p "$WORK" "$TRACE_ROOT"

            .venv/bin/python scripts/collect_medoid_multil_traces.py \
              --binary "$TRACE_BIN" \
              --queries "$QUERIES" \
              --gt "$GT" \
              --index-prefix "$INDEX_PREFIX" \
              --work "$WORK" \
              --out "$TRACE_ROOT" \
              --train-rows 10000 \
              --teacher-ls "64" \
              2>&1 | tee "$ART/trace.log"
            rm -rf "$WORK"
          fi

          test -s "$TRACE"
          test "$(wc -l < "$TRACE")" -eq 10000
          cp "$TRACE_ROOT/multi-l-trace-summary.json" "$ART/"
          sha256sum "$TRACE" > "$ART/trace.sha256"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"

      - name: Ensure region partitions
        run: |
          set -euxo pipefail
          for nlist in 64 128 256 512; do
            dir="$ROUTER_ROOT/nlist-$nlist"
            router="$dir/router.bin"
            manifest="$dir/router.manifest.json"
            mkdir -p "$dir"
            if [ ! -s "$router" ] || [ ! -s "$manifest" ]; then
              rm -f "$router" "$manifest"
              .venv/bin/python scripts/prepare_pubmed_ip_portal_router.py \
                --base "$BASE" \
                --out "$router" \
                --nlist "$nlist" \
                --train-size 100000 \
                --seed 12345 \
                --threads 4 \
                2>&1 | tee "$ART/build-router-$nlist.log"
            fi
            test -s "$router"
            test -s "$manifest"
            cp "$manifest" "$ART/router-$nlist.manifest.json"
          done

      - name: Run 9K training diagnostic
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/analyze_region_conditioned_navigation.py \
            --base "$BASE" \
            --queries "$QUERIES" \
            --trace "$TRACE" \
            --router-root "$ROUTER_ROOT" \
            --regions "64,128,256,512" \
            --train-queries 9000 \
            --min-entry-pos 8 \
            --topks "8,16,32" \
            --out "$ART/region-conditioned-navigation-9k.json" \
            2>&1 | tee "$ART/diagnostic.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-region-conditioned-navigation-${{ github.run_id }}
          path: artifacts/long-region-conditioned-navigation/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/region-long-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/region-long-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/region-long-trace-$GITHUB_RUN_ID"
