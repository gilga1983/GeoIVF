name: High-L landmark teacher distillation
on:
  push:
    branches: [experiment/high-l-landmark-teacher]
    paths:
      - '.github/workflows/high-l-landmark-teacher.yml'
      - 'scripts/run_high_l_landmark_teacher_ci.sh'
      - 'scripts/collect_medoid_multil_traces.py'
      - 'scripts/qualify_high_l_landmark_teacher.py'
      - 'scripts/learn_global_navigation_landmarks.py'
      - 'scripts/patch_diskann_waypoint_trace.py'
      - 'scripts/patch_diskann_global_starts.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-high-l-landmark-teacher
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run high-L teacher distillation
        run: bash scripts/run_high_l_landmark_teacher_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-l-landmark-teacher-${{ github.run_id }}
          path: artifacts/high-l-landmark-teacher/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/highl-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/highl-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/highl-trace-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/highl-eval-$GITHUB_RUN_ID"
