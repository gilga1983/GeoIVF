name: CatapultDB original author source on chronological Coveo

on:
  push:
    branches: [experiment/catapult-original-author]
    paths:
      - '.github/workflows/catapult-original-coveo.yml'
      - 'scripts/run_catapult_original_coveo_ci.sh'
      - 'scripts/catapult_original_coveo_eval.rs'
      - 'scripts/prepare_catapult_original_coveo.py'
      - 'scripts/verify_catapult_author_graph.py'
      - 'scripts/summarize_catapult_original_coveo.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-catapult-original-coveo
  cancel-in-progress: false

jobs:
  evaluate-authors-unchanged-algorithm:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      CARGO_BUILD_JOBS: '4'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      RUSTFLAGS: '-C target-cpu=native'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify author-native causal harness and licensed local Coveo split
        shell: bash
        run: |
          python3 -m py_compile scripts/prepare_catapult_original_coveo.py
          python3 -m py_compile scripts/verify_catapult_author_graph.py
          python3 -m py_compile scripts/summarize_catapult_original_coveo.py
          bash -n scripts/run_catapult_original_coveo_ci.sh
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/dataset.manifest.json"
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/replay.gt"
          command -v rustup
          command -v cmake
          df -h "$RUNNER_TEMP"
      - name: Build original authors source and compare vanilla to real Catapult
        shell: bash
        run: bash scripts/run_catapult_original_coveo_ci.sh
      - name: Preserve pinned author revision, graph validation, native metrics and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catapult-author-coveo
          path: artifacts/catapult-author-coveo/
          retention-days: 30
      - name: Clean only this run's temporary original-source graph and build
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/catapult-author-coveo-$GITHUB_RUN_ID"
