name: Persistent co-result page hints

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/persistent-coresult.yml'
      - 'scripts/build_persistent_coresult_payload.py'
      - 'scripts/patch_diskann_persistent_coresult.py'
      - 'scripts/qualify_persistent_coresult.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-persistent-coresult
  cancel-in-progress: true

jobs:
  screen:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6

          ART="$PWD/artifacts/persistent-coresult"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          GT5000="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          ORIG="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          IVF16="$HOME/.cache/geoivf/onpolicy-staged-navhints-v1/canonical-b16000-c512.bin"
          BASE_PAYLOAD="$HOME/.cache/geoivf/vertex-navhints-v1/vertex-continuations.bin"
          BASE_VERTEX="$HOME/.cache/geoivf/vertex-navhints-v1/diskann-index"
          ROOT="$HOME/.cache/geoivf/persistent-coresult-v1"
          COMBINED_PAYLOAD="$ROOT/vertex-continuations-plus-persistent.bin"
          PERSIST="$ROOT/diskann-index"
          ENTRIES="$ROOT/cache-entries"

          mkdir -p "$ART" "$ROOT" "$ENTRIES"
          for f in "$QUERIES" "$GT5000" "$ORIG"_disk.index "$ORIG"_pq_pivots.bin "$ORIG"_pq_compressed.bin "$IVF16" "$BASE_PAYLOAD"; do test -s "$f"; done

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "GT5000=$GT5000" >> "$GITHUB_ENV"
          echo "ORIG=$ORIG" >> "$GITHUB_ENV"
          echo "IVF16=$IVF16" >> "$GITHUB_ENV"
          echo "BASE_PAYLOAD=$BASE_PAYLOAD" >> "$GITHUB_ENV"
          echo "BASE_VERTEX=$BASE_VERTEX" >> "$GITHUB_ENV"
          echo "COMBINED_PAYLOAD=$COMBINED_PAYLOAD" >> "$GITHUB_ENV"
          echo "PERSIST=$PERSIST" >> "$GITHUB_ENV"
          echo "ENTRIES=$ENTRIES" >> "$GITHUB_ENV"

          .venv/bin/python -m py_compile             scripts/build_persistent_coresult_payload.py             scripts/patch_diskann_persistent_coresult.py             scripts/qualify_persistent_coresult.py             scripts/build_dedup_semantic_value_cache.py             scripts/embed_vertex_navhints_in_diskann_index.py             scripts/patch_diskann_semantic_cache_page.py             scripts/patch_diskann_result_ids_dump.py

      - name: Ensure baseline vertex index
        run: |
          set -euxo pipefail
          if [ ! -s "$BASE_VERTEX"_disk.index ]; then
            .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py               --input-disk-index "$ORIG"_disk.index               --payload "$BASE_PAYLOAD"               --output-disk-index "$BASE_VERTEX"_disk.index
          fi
          rm -f "$BASE_VERTEX"_pq_pivots.bin "$BASE_VERTEX"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$BASE_VERTEX"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$BASE_VERTEX"_pq_compressed.bin
          test -s "$BASE_VERTEX"_disk.index

      - name: Install pinned Rust toolchain
        run: |
          set -euxo pipefail
          export CARGO_HOME="$RUNNER_TEMP/persistent-cargo-$GITHUB_RUN_ID"
          export RUSTUP_HOME="$RUNNER_TEMP/persistent-rustup-$GITHUB_RUN_ID"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/persistent-rustup-$GITHUB_RUN_ID.sh"
          sh "$RUNNER_TEMP/persistent-rustup-$GITHUB_RUN_ID.sh" -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Build five-variant producer
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-persistent-producer
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-persistent-producer
          git -C third_party/DiskANN-persistent-producer checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-persistent-producer --variants 5
          .venv/bin/python scripts/patch_diskann_result_ids_dump.py third_party/DiskANN-persistent-producer
          (cd third_party/DiskANN-persistent-producer && cargo fmt --all)
          git -C third_party/DiskANN-persistent-producer diff --check
          (cd third_party/DiskANN-persistent-producer && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/producer-build.log"
          echo "PRODUCER_BIN=$PWD/third_party/DiskANN-persistent-producer/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Produce actual prior L160 results
        run: |
          set -euxo pipefail
          WARM="$ART/warm5000.fbin"
          .venv/bin/python - "$QUERIES" "$WARM" <<'PY'
          import struct,sys
          from pathlib import Path
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          with src.open("rb") as f:
              rows,dim=struct.unpack("<II",f.read(8))
              assert rows==10000
              f.seek(8+5000*dim*4)
              data=f.read()
          assert len(data)==5000*dim*4
          with dst.open("wb") as g:
              g.write(struct.pack("<II",5000,dim)); g.write(data)
          PY

          .venv/bin/python - "$ART/producer.input.json" "$WARM" "$GT5000" "$BASE_VERTEX" <<'PY'
          import json,sys
          from pathlib import Path
          out,q,gt,prefix=map(Path,sys.argv[1:])
          cfg={"search_directories":[str(out.parent)],"jobs":[{"type":"disk-index","content":{
            "source":{"disk-index-source":"Load","data_type":"float32","load_path":str(prefix)},
            "search_phase":{"queries":str(q),"groundtruth":str(gt),"search_list":[160],
              "beam_width":8,"recall_at":10,"num_threads":4,"is_flat_search":False,
              "distance":"inner_product","vector_filters_file":None,"num_nodes_to_cache":None,
              "search_io_limit":None,"post_processor":None}}}]}
          out.write_text(json.dumps(cfg))
          PY

          export DISKANN_HINT_IVF_FILE="$IVF16"
          export DISKANN_HINT_IVF_NPROBE=8
          export DISKANN_HINT_IVF_MAX_STARTS=1
          export DISKANN_VERTEX_HINT_VARIANT=1
          export DISKANN_RESULT_IDS_FILE="$ART/producer.bin"
          "$PRODUCER_BIN" run             --input-file "$ART/producer.input.json"             --output-file "$ART/producer.output.json"             2>&1 | tee "$ART/producer.log"
          unset DISKANN_RESULT_IDS_FILE DISKANN_VERTEX_HINT_VARIANT DISKANN_HINT_IVF_FILE DISKANN_HINT_IVF_NPROBE DISKANN_HINT_IVF_MAX_STARTS
          test -s "$ART/producer.bin"

      - name: Learn persistent warm overlay
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/build_persistent_coresult_payload.py             --base-payload "$BASE_PAYLOAD"             --results "$ART/producer.bin"             --output "$COMBINED_PAYLOAD"             --warm-rows 4000             2>&1 | tee "$ART/persistent-payload.log"
          cp "$COMBINED_PAYLOAD.manifest.json" "$ART/persistent-payload-manifest.json"

      - name: Embed six-variant persistent index
        run: |
          set -euxo pipefail
          rm -f "$PERSIST"_disk.index "$PERSIST"_disk.index.manifest.json
          .venv/bin/python scripts/embed_vertex_navhints_in_diskann_index.py             --input-disk-index "$ORIG"_disk.index             --payload "$COMBINED_PAYLOAD"             --output-disk-index "$PERSIST"_disk.index             2>&1 | tee "$ART/persistent-index.log"
          rm -f "$PERSIST"_pq_pivots.bin "$PERSIST"_pq_compressed.bin
          ln -s "$ORIG"_pq_pivots.bin "$PERSIST"_pq_pivots.bin
          ln -s "$ORIG"_pq_compressed.bin "$PERSIST"_pq_compressed.bin
          test -s "$PERSIST"_disk.index
          cp "$PERSIST"_disk.index.manifest.json "$ART/persistent-index-manifest.json"

      - name: Build frozen SkipDup cache entries
        run: |
          set -euxo pipefail
          rm -rf "$ENTRIES"; mkdir -p "$ENTRIES"
          .venv/bin/python scripts/build_dedup_semantic_value_cache.py             --queries "$QUERIES"             --pq-pivots "$ORIG"_pq_pivots.bin             --pq-codes "$ORIG"_pq_compressed.bin             --results "$ART/producer.bin"             --out-dir "$ENTRIES"             --capacities "512,2048"             2>&1 | tee "$ART/cache-build.log"
          cp "$ENTRIES/manifest.json" "$ART/cache-manifest.json"

      - name: Build six-variant persistent evaluator
        run: |
          set -euxo pipefail
          export PATH="$CARGO_HOME/bin:$PATH"
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          rm -rf third_party/DiskANN-persistent-eval
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-persistent-eval
          git -C third_party/DiskANN-persistent-eval checkout --detach "$rev"
          .venv/bin/python scripts/patch_diskann_vertex_navhints.py third_party/DiskANN-persistent-eval --variants 6
          .venv/bin/python scripts/patch_diskann_semantic_cache_page.py third_party/DiskANN-persistent-eval
          .venv/bin/python scripts/patch_diskann_persistent_coresult.py third_party/DiskANN-persistent-eval
          (cd third_party/DiskANN-persistent-eval && cargo fmt --all)
          git -C third_party/DiskANN-persistent-eval diff --check
          (cd third_party/DiskANN-persistent-eval && cargo build --release --locked -p diskann-benchmark --features disk-index)             2>&1 | tee "$ART/evaluator-build.log"
          echo "EVAL_BIN=$PWD/third_party/DiskANN-persistent-eval/target/release/diskann-benchmark" >> "$GITHUB_ENV"

      - name: Evaluate persistence
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/persistent-eval-$GITHUB_RUN_ID"
          OUT="$ART/results"
          rm -rf "$WORK" "$OUT"; mkdir -p "$WORK" "$OUT"
          .venv/bin/python scripts/qualify_persistent_coresult.py             --binary "$EVAL_BIN"             --queries "$QUERIES"             --gt5000 "$GT5000"             --index-prefix "$PERSIST"             --ivf-16k "$IVF16"             --entry-dir "$ENTRIES"             --cache-manifest "$ENTRIES/manifest.json"             --persistent-manifest "$COMBINED_PAYLOAD.manifest.json"             --work "$WORK"             --out "$OUT"             --reps 5             2>&1 | tee "$ART/eval.log"
          rm -rf "$WORK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-coresult-${{ github.run_id }}
          path: artifacts/persistent-coresult/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/persistent-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/persistent-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/persistent-eval-$GITHUB_RUN_ID"
