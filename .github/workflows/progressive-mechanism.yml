name: Progressive NavHints mechanism study
on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/progressive-mechanism.yml'
      - 'scripts/run_progressive_mechanism_ci.sh'
      - 'scripts/qualify_progressive_mechanism.py'
      - 'scripts/patch_diskann_progressive_navhints.py'
      - 'scripts/qualify_staged_navhints.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-progressive-mechanism
  cancel-in-progress: true

jobs:
  mechanism:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run progressive mechanism study
        shell: bash
        run: bash scripts/run_progressive_mechanism_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progressive-mechanism-${{ github.run_id }}
          path: artifacts/progressive-mechanism/
          retention-days: 30
      - name: Clean scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/progmech-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/progmech-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/progmech-eval-$GITHUB_RUN_ID"
