name: Staged NavHints equal-memory A/B
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-performance
  cancel-in-progress: false

jobs:
  staged:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run staged NavHints A/B
        run: bash scripts/run_staged_navhints_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-navhints-${{ github.run_id }}
          path: artifacts/staged-navhints/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/staged-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/staged-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/staged-eval-$GITHUB_RUN_ID"
