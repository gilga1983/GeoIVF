name: Region-conditioned navigation diagnostic

on:
  push:
    branches: [experiment/staged-navhints]
    paths:
      - '.github/workflows/region-conditioned-navigation.yml'
      - 'scripts/analyze_region_conditioned_navigation.py'
      - 'scripts/prepare_pubmed_ip_portal_router.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-region-conditioned-navigation
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare diagnostic inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6 "faiss-cpu>=1.9,<2"

          ART="$PWD/artifacts/region-conditioned-navigation"
          BASE="$HOME/.cache/geoivf/catapult-paper-pubmed1m/pubmed-medcpt-first1m.fbin"
          QUERIES="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          TRACE="$HOME/.cache/geoivf/high-l-medoid-teacher-traces-v1/medoid-teacher.L64.jsonl"
          ROUTER_ROOT="$HOME/.cache/geoivf/region-ablation-routers-v1"

          mkdir -p "$ART" "$ROUTER_ROOT"
          test -s "$BASE"
          test -s "$QUERIES"
          test -s "$TRACE"

          echo "ART=$ART" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "QUERIES=$QUERIES" >> "$GITHUB_ENV"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"
          echo "ROUTER_ROOT=$ROUTER_ROOT" >> "$GITHUB_ENV"

          git rev-parse HEAD > "$ART/geoivf-commit.txt"
          .venv/bin/python -m py_compile scripts/analyze_region_conditioned_navigation.py

      - name: Ensure 64 and 128 region partitions
        run: |
          set -euxo pipefail
          for nlist in 64 128; do
            dir="$ROUTER_ROOT/nlist-$nlist"
            router="$dir/router.bin"
            manifest="$dir/router.manifest.json"
            mkdir -p "$dir"

            if [ ! -s "$router" ] || [ ! -s "$manifest" ]; then
              rm -f "$router" "$manifest"
              .venv/bin/python scripts/prepare_pubmed_ip_portal_router.py \
                --base "$BASE" \
                --out "$router" \
                --nlist "$nlist" \
                --train-size 100000 \
                --seed 12345 \
                --threads 4 \
                2>&1 | tee "$ART/build-router-$nlist.log"
            fi

            test -s "$router"
            test -s "$manifest"
            cp "$manifest" "$ART/router-$nlist.manifest.json"
          done

      - name: Compare region state with traversal age
        run: |
          set -euxo pipefail
          .venv/bin/python scripts/analyze_region_conditioned_navigation.py \
            --base "$BASE" \
            --queries "$QUERIES" \
            --trace "$TRACE" \
            --router-root "$ROUTER_ROOT" \
            --regions "64,128" \
            --train-queries 4000 \
            --min-entry-pos 8 \
            --topks "8,16,32" \
            --out "$ART/region-conditioned-navigation.json" \
            2>&1 | tee "$ART/diagnostic.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-conditioned-navigation-${{ github.run_id }}
          path: artifacts/region-conditioned-navigation/
          retention-days: 30
