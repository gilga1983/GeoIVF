name: Navigation memory exact recall
on:
  push:
    branches: [experiment/navigation-memory-baselines]
    paths:
      - '.github/workflows/navigation-memory-recall.yml'
      - 'scripts/qualify_navigation_memory_recall.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-navigation-memory-recall
  cancel-in-progress: true

jobs:
  recall:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 480
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare cached inputs
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install numpy==2.2.6
          mkdir -p artifacts/navigation-memory-recall

          queries="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/medrag-zipf-10k-medcpt.fbin"
          gt="$HOME/.cache/geoivf/medrag-zipf-qwen3b-v1/heldout5000-pubmed1m-top16-ip.gt"
          index="$HOME/.cache/geoivf/catapult-paper-pubmed1m-index-v1/diskann-index"
          qsev="$HOME/.cache/geoivf/pubmed1m-qsev-3mib-v1/qsev-1024.bin"
          router="$HOME/.cache/geoivf/region-ablation-routers-v1/nlist-512/router.bin"
          waypoint="$HOME/.cache/geoivf/region-ablation-caches-v1/nlist-512/heavy-skip-b2500.bin"

          for f in "$queries" "$gt" "$qsev" "$router" "$waypoint"; do
            test -s "$f"
          done

          echo "QUERIES=$queries" >> "$GITHUB_ENV"
          echo "GT=$gt" >> "$GITHUB_ENV"
          echo "INDEX_PREFIX=$index" >> "$GITHUB_ENV"
          echo "QSEV=$qsev" >> "$GITHUB_ENV"
          echo "ROUTER=$router" >> "$GITHUB_ENV"
          echo "WAYPOINT=$waypoint" >> "$GITHUB_ENV"

          git rev-parse HEAD > artifacts/navigation-memory-recall/geoivf-commit.txt
          .venv/bin/python -m py_compile scripts/qualify_navigation_memory_recall.py

      - name: Compile QSEV DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-recall-qsev
          git -C third_party/DiskANN-recall-qsev checkout --detach "$rev"

          CARGO_HOME="$RUNNER_TEMP/recall-qsev-cargo-${GITHUB_RUN_ID}"
          RUSTUP_HOME="$RUNNER_TEMP/recall-qsev-rustup-${GITHUB_RUN_ID}"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
          curl -fsSL --retry 3 https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-qsev-${GITHUB_RUN_ID}.sh"
          CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME" \
            sh "$RUNNER_TEMP/rustup-qsev-${GITHUB_RUN_ID}.sh" \
              -y --profile minimal --no-modify-path --default-toolchain 1.97.1
          export CARGO_HOME RUSTUP_HOME
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rustfmt

          .venv/bin/python scripts/patch_diskann_qsev.py third_party/DiskANN-recall-qsev
          (cd third_party/DiskANN-recall-qsev && cargo fmt --all)
          git -C third_party/DiskANN-recall-qsev diff --check
          (cd third_party/DiskANN-recall-qsev && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/navigation-memory-recall/qsev-build.log
          echo "QSEV_BIN=$PWD/third_party/DiskANN-recall-qsev/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Compile waypoint DiskANN
        run: |
          set -euxo pipefail
          rev=fcf90534174cf29c78c9f13b4cccf1fcabff85f5
          git clone --filter=blob:none https://github.com/microsoft/DiskANN.git third_party/DiskANN-recall-waypoint
          git -C third_party/DiskANN-recall-waypoint checkout --detach "$rev"

          export CARGO_HOME="$RUNNER_TEMP/recall-qsev-cargo-${GITHUB_RUN_ID}"
          export RUSTUP_HOME="$RUNNER_TEMP/recall-qsev-rustup-${GITHUB_RUN_ID}"
          export PATH="$CARGO_HOME/bin:$PATH"

          .venv/bin/python scripts/patch_diskann_waypoint_cache.py third_party/DiskANN-recall-waypoint
          (cd third_party/DiskANN-recall-waypoint && cargo fmt --all)
          git -C third_party/DiskANN-recall-waypoint diff --check
          (cd third_party/DiskANN-recall-waypoint && \
            cargo build --release --locked -p diskann-benchmark --features disk-index) \
            2>&1 | tee artifacts/navigation-memory-recall/waypoint-build.log
          echo "WAYPOINT_BIN=$PWD/third_party/DiskANN-recall-waypoint/target/release/diskann-benchmark" \
            >> "$GITHUB_ENV"

      - name: Run exact heldout recall
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/navigation-memory-recall-${GITHUB_RUN_ID}"
          out="$PWD/artifacts/navigation-memory-recall/results"
          mkdir -p "$work" "$out"

          .venv/bin/python scripts/qualify_navigation_memory_recall.py \
            --qsev-binary "$QSEV_BIN" \
            --waypoint-binary "$WAYPOINT_BIN" \
            --queries "$QUERIES" \
            --gt "$GT" \
            --index-prefix "$INDEX_PREFIX" \
            --qsev "$QSEV" \
            --router "$ROUTER" \
            --waypoint "$WAYPOINT" \
            --work "$work" \
            --out "$out" \
            --train-rows 5000 \
            2>&1 | tee artifacts/navigation-memory-recall/recall.log

          rm -rf "$work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-memory-recall-${{ github.run_id }}
          path: artifacts/navigation-memory-recall/
          retention-days: 30

      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/recall-qsev-cargo-${GITHUB_RUN_ID}" \
                 "$RUNNER_TEMP/recall-qsev-rustup-${GITHUB_RUN_ID}"
