name: Final NavHints Core on chronological Coveo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-final-core-coveo
  cancel-in-progress: false

jobs:
  chronological-coveo:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    env:
      CARGO_BUILD_JOBS: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      RUSTFLAGS: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify same chronology, final Core memory and Sample2 causal logic
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/qualify_final_core_coveo.py scripts/patch_navhints_regional_history.py
          bash -n scripts/run_final_core_coveo_ci.sh
          grep -F -- '--budget 14464' scripts/run_final_core_coveo_ci.sh
          grep -F 'DISKANN_LOCAL_RECENT_STARTS' scripts/qualify_final_core_coveo.py
          test -s "$HOME/.cache/geoivf/coveo-real-demand-v1/split/replay.gt"
      - name: Reevaluate final Core and optional Sample2 on real chronological traffic
        shell: bash
        run: bash scripts/run_final_core_coveo_ci.sh
      - name: Preserve licensed-input hashes, learned state, SSD results and write counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navhints-final-core-coveo
          path: artifacts/final-core-coveo/
          retention-days: 14
      - name: Clean this isolated checkout only
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/final-core-coveo-$GITHUB_RUN_ID"
