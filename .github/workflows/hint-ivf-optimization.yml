name: Hint IVF optimization
on:
  push:
    branches: [experiment/hint-ivf-optimized]
    paths:
      - '.github/workflows/hint-ivf-optimization.yml'
      - 'scripts/run_hint_ivf_optimization_ci.sh'
      - 'scripts/qualify_hint_ivf_optimization.py'
      - 'scripts/patch_diskann_hint_ivf.py'
      - 'scripts/patch_diskann_hint_ivf_fast.py'
      - 'scripts/patch_diskann_hint_ivf_integrated.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/learn_global_navigation_landmarks.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-hint-ivf-optimization
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run optimization A/B
        run: bash scripts/run_hint_ivf_optimization_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hint-ivf-optimization-${{ github.run_id }}
          path: artifacts/hint-ivf-optimization/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hintopt-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintopt-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/hintopt-eval-$GITHUB_RUN_ID"
