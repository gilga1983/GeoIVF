name: Stop stale broad paper competitor run
on:
  push:
    branches: [experiment/paper-competitors]
    paths:
      - '.github/workflows/stop-stale-papercomp.yml'
permissions:
  contents: read
jobs:
  stop:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 5
    steps:
      - name: Stop only stale paper competitor evaluator
        shell: bash
        run: |
          set -x
          pgrep -af 'qualify_paper_competitors_phase1.py' || true
          pkill -TERM -f '[q]ualify_paper_competitors_phase1.py' || true
          sleep 2
          pkill -KILL -f '[q]ualify_paper_competitors_phase1.py' || true
          pgrep -af 'qualify_paper_competitors_phase1.py' || true
