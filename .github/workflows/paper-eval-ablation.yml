name: NavHints paper ablations
on:
  push:
    branches: [experiment/paper-eval-ablation]
    paths:
      - '.github/workflows/paper-eval-ablation.yml'
      - 'scripts/run_paper_ablation_ci.sh'
      - 'scripts/learn_landmark_variants.py'
      - 'scripts/prepare_paper_ablation_states.py'
      - 'scripts/qualify_paper_ablation.py'
      - 'scripts/build_hint_ivf.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/perf_guard.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoivf-paper-eval-ablation
  cancel-in-progress: true

jobs:
  ablation:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run paper ablations
        run: bash scripts/run_paper_ablation_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ablation-${{ github.run_id }}
          path: artifacts/paper-ablation/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/paperab-cargo-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/paperab-rustup-$GITHUB_RUN_ID" \
                 "$RUNNER_TEMP/paper-ablation-$GITHUB_RUN_ID"
