name: Frozen Fill2 paper competitors

on:
  push:
    branches: [experiment/frozen-paper-competitors]
    paths:
      - '.github/workflows/frozen-paper-competitors.yml'
      - 'scripts/run_frozen_paper_competitors_ci.sh'
      - 'scripts/qualify_frozen_paper_competitors.py'
      - 'scripts/patch_diskann_hint_ivf_packed_direct.py'
      - 'scripts/patch_diskann_experience_core.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoivf-frozen-paper-competitors
  cancel-in-progress: true

jobs:
  compare:
    runs-on: [self-hosted, linux, x64, geoivf]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen-controller competitor frontier
        run: bash scripts/run_frozen_paper_competitors_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-paper-competitors-${{ github.run_id }}
          path: artifacts/frozen-paper-competitors/
          retention-days: 30
      - name: Clean scratch
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/frozencomp-cargo-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/frozencomp-rustup-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/frozencomp-eval-$GITHUB_RUN_ID"                  "$RUNNER_TEMP/frozen-comp-heldout-$GITHUB_RUN_ID.fbin"
